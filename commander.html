<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Force One - Tactical C2 Dashboard</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-dark: #0a0e17;
            --panel-bg: #111827;
            --border: #1e293b;
            
            /* Status Colors */
            --color-online: #15803d;             /* Dark Green */
            --color-offline: rgba(148, 163, 184, 0.35); /* Very Faint */
            --color-gps-lost: rgba(234, 179, 8, 0.5);   /* Faint Yellow */
            --color-distress: #dc2626;           /* Solid Red */
            
            --accent-blue: #38bdf8;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, -apple-system, sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* Security Authorization Overlay */
        #authOverlay {
            position: fixed; inset: 0; background: rgba(8, 12, 20, 0.98); 
            z-index: 9999; display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(8px);
        }
        .auth-card {
            background: #111827; border: 1px solid #334155; padding: 36px 30px; 
            border-radius: 12px; width: 360px; max-width: 90vw; text-align: center; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9), 0 0 20px rgba(56, 189, 248, 0.15);
        }
        
        .auth-logo-svg {
            width: 84px; height: 84px; margin: 0 auto 10px auto; display: block;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.35));
        }
        .auth-welcome-title {
            font-size: 1.85rem; font-weight: 900; letter-spacing: 3px; 
            color: #ffffff; text-transform: uppercase; margin-top: 6px;
        }
        .auth-subtitle {
            font-size: 0.72rem; font-weight: 700; letter-spacing: 2.5px; 
            color: var(--accent-blue); text-transform: uppercase; margin-bottom: 22px;
        }

        .auth-card input {
            width: 100%; padding: 12px 14px; margin-bottom: 16px; background: #0f172a; 
            border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 0.95rem; text-align: center;
            letter-spacing: 1px; outline: none; transition: 0.2s border;
        }
        .auth-card input:focus { border-color: var(--accent-blue); }
        .auth-card button {
            width: 100%; padding: 12px; background: var(--accent-blue); border: none; 
            border-radius: 6px; font-weight: 900; font-size: 0.9rem; letter-spacing: 1.5px; 
            cursor: pointer; color: #0a0e17; text-transform: uppercase; transition: 0.2s background;
        }
        .auth-card button:hover { background: #7dd3fc; }

        /* Header Operations Bar */
        header { 
            min-height: 54px; background: var(--panel-bg); border-bottom: 2px solid #334155; 
            display: flex; justify-content: space-between; align-items: center; padding: 6px 16px; 
            z-index: 1000; flex-wrap: wrap; gap: 8px;
        }
        .header-brand { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .op-title { font-weight: 900; font-size: 1.05rem; letter-spacing: 2px; color: var(--accent-blue); }
        .stat-badges { display: flex; gap: 8px; font-size: 0.8rem; font-weight: bold; }
        .badge { padding: 4px 8px; border-radius: 4px; background: #0f172a; border: 1px solid var(--border); white-space: nowrap; }

        .toolbar-actions {
            display: flex; align-items: center; gap: 4px; overflow-x: auto; 
            max-width: 100%; -webkit-overflow-scrolling: touch; scrollbar-width: none;
        }
        .toolbar-actions::-webkit-scrollbar { display: none; }

        /* Emergency Casualty Banner */
        #casualtyNoticeBar { 
            display: none; background: #7f1d1d; border-bottom: 2px solid var(--color-distress); 
            color: #fff; padding: 8px 16px; font-size: 0.85rem; font-weight: bold; 
            justify-content: space-between; align-items: center; z-index: 2000; flex-wrap: wrap; gap: 6px;
        }

        /* Workspace Grid */
        .workspace { flex: 1; display: flex; position: relative; overflow: hidden; width: 100%; }
        #tacticalMap { flex: 1; height: 100%; width: 100%; background: #000; }

        /* Compass HUD */
        .tactical-compass-hud {
            position: absolute; top: 14px; left: 14px; z-index: 1000;
            background: rgba(15, 23, 42, 0.85); border: 1px solid var(--border);
            border-radius: 8px; padding: 6px; display: flex; flex-direction: column;
            align-items: center; gap: 5px; backdrop-filter: blur(6px);
            box-shadow: 0 4px 14px rgba(0,0,0,0.6); user-select: none;
        }
        .compass-dial-btn {
            width: 44px; height: 44px; border-radius: 50%; background: #1e293b;
            border: 2px solid #334155; cursor: pointer; display: flex;
            align-items: center; justify-content: center; position: relative;
        }
        .compass-needle-svg { width: 32px; height: 32px; transition: transform 0.2s ease-out; }
        .compass-bearing-label { font-size: 0.65rem; font-weight: 900; color: var(--accent-blue); letter-spacing: 1px; }
        .compass-actions { display: flex; gap: 3px; }
        .btn-rot {
            background: #1e293b; color: #fff; border: 1px solid var(--border);
            border-radius: 4px; font-size: 0.7rem; font-weight: bold;
            padding: 3px 6px; cursor: pointer; transition: 0.15s;
        }
        .btn-rot:hover { background: var(--accent-blue); color: #000; }

        /* Sidebar Roster */
        .sidebar { 
            width: 340px; background: var(--panel-bg); border-left: 2px solid var(--border); 
            display: flex; flex-direction: column; transition: all 0.2s ease-in-out; z-index: 1050;
        }
        .sidebar-header { 
            padding: 12px 16px; border-bottom: 1px solid var(--border); 
            font-size: 0.85rem; font-weight: bold; color: var(--accent-blue); 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .unit-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }

        /* Commando Cards - Zero Blinking */
        .unit-card { 
            background: #0f172a; border: 1px solid var(--border); border-radius: 6px; 
            padding: 10px; cursor: pointer; transition: border-color 0.2s, background 0.2s;
        }
        
        /* State Card Styles */
        .unit-card.card-online {
            border: 1px solid var(--color-online);
            border-left: 4px solid var(--color-online);
            background: #0f172a;
        }
        .unit-card.card-casualty {
            border: 2px solid var(--color-distress);
            background: rgba(127, 29, 29, 0.35);
        }
        .unit-card.card-stale {
            border: 1px solid var(--color-gps-lost);
            background: rgba(30, 27, 75, 0.25);
            opacity: 0.85;
        }
        .unit-card.card-offline {
            border: 1px solid var(--color-offline);
            background: rgba(15, 23, 42, 0.35);
            opacity: 0.4;
            color: #64748b;
        }

        .btn-listen { 
            width: 100%; margin-top: 8px; padding: 8px; font-size: 0.75rem; font-weight: bold; 
            border: none; border-radius: 4px; cursor: pointer; background: #dc2626; color: #fff; 
        }
        .btn-listen.monitoring { background: var(--color-online); color: #fff; }

        .btn-tool {
            background: #1e293b; color: #fff; border: 1px solid var(--border); 
            padding: 6px 10px; font-size: 0.72rem; border-radius: 4px; cursor: pointer; 
            white-space: nowrap; flex-shrink: 0;
        }
        .btn-tool.active { background: var(--accent-blue); color: #000; font-weight: bold; }
        .btn-tool.btn-threat { border-color: #dc2626; color: #fca5a5; }
        .btn-tool.btn-threat.active { background: #dc2626; color: #fff; font-weight: bold; }
        .btn-tool.btn-ied { border-color: #d97706; color: #fde68a; }
        .btn-tool.btn-ied.active { background: #d97706; color: #000; font-weight: bold; }
        .btn-logout { background: #dc2626; border-color: #ef4444; font-weight: bold; }

        /* Tactical Markers - Zero Blinking */
        .commando-marker {
            width: 28px; height: 28px; border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; font-size: 11px; 
            font-weight: 900; color: #fff; border: 2px solid #fff; box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .commando-marker.marker-online {
            background: var(--color-online) !important;
            border-color: #86efac;
        }
        .commando-marker.marker-casualty { 
            background: var(--color-distress) !important; 
            border-color: #ffffff;
        }
        .commando-marker.marker-stale {
            background: var(--color-gps-lost) !important;
            border-color: #fef08a;
            opacity: 0.8;
        }
        .commando-marker.marker-offline {
            background: var(--color-offline) !important;
            border-color: #64748b;
            opacity: 0.35;
        }

        .dark-tiles { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }

        @media (max-width: 768px) {
            header { padding: 6px 10px; }
            .op-title { font-size: 0.85rem; letter-spacing: 1.5px; }
            .stat-badges { font-size: 0.7rem; gap: 4px; }
            .badge { padding: 2px 6px; }
            .toolbar-actions { width: 100%; overflow-x: auto; padding: 2px 0; }
            .sidebar {
                position: absolute; top: 0; right: 0; bottom: 0; width: 86vw; max-width: 350px;
                box-shadow: -10px 0 30px rgba(0, 0, 0, 0.85);
            }
            .tactical-compass-hud { top: 10px; left: 10px; padding: 4px; }
        }
    </style>

    <!-- Leaflet & Leaflet-Rotate SDKs -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

    <!-- Remote Audio Player for Casualty Audio Intercept -->
    <audio id="remoteAudioPlayer" autoplay playsinline></audio>

    <!-- Security Authorization Screen -->
    <div id="authOverlay">
        <div class="auth-card">
            <svg class="auth-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 4L12 18V50C12 73.5 50 96 50 96C50 96 88 73.5 88 50V18L50 4Z" fill="#0f172a" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
                <path d="M50 10L18 22V48C18 67 50 86 50 86C50 86 82 67 82 48V22L50 10Z" stroke="#f59e0b" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M50 18V64" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
                <path d="M43 27L50 18L57 27" fill="#ffffff"/>
                <path d="M38 48H62" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
                <path d="M47 52H53M47 57H53M47 62H53" stroke="#94a3b8" stroke-width="2"/>
                <circle cx="50" cy="68" r="3" fill="#f59e0b"/>
                <path d="M26 40L36 46L29 55L40 50" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M74 40L64 46L71 55L60 50" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M50 74L51.8 78.5L56.5 78.5L52.7 81.2L54.2 85.5L50 83L45.8 85.5L47.3 81.2L43.5 78.5L48.2 78.5L50 74Z" fill="#f59e0b"/>
            </svg>

            <div class="auth-welcome-title">WELCOME</div>
            <div class="auth-subtitle">COMMANDO TRACKING SYSTEM</div>

            <input type="password" id="c2Password" placeholder="Enter Password" onkeydown="if(event.key==='Enter') verifyAccess()">
            <button onclick="verifyAccess()">LOGIN</button>
        </div>
    </div>

    <!-- Emergency Casualty Alert Banner -->
    <div id="casualtyNoticeBar">
        <span id="casualtyNoticeText">🚨 SIGNAL ALERT: CASUALTY / DISTRESS RECORDED ON GRID</span>
        <button onclick="focusLatestCasualty()" style="background:#fff; color:#000; border:none; padding:4px 10px; font-weight:bold; cursor:pointer; border-radius:4px;">FOCUS TARGET</button>
    </div>

    <!-- Header Operations Bar -->
    <header>
        <div class="header-brand">
            <div class="op-title">FORCE ONE TACTICAL C2</div>
            <div class="stat-badges">
                <div class="badge" style="color:var(--color-online);">ONLINE: <span id="onlineCount">0</span></div>
                <div class="badge" style="color:var(--color-distress);">CASUALTIES: <span id="casualtyCount">0</span></div>
                <div class="badge" style="color:#ca8a04;">GPS LOST: <span id="staleCount">0</span></div>
            </div>
        </div>
        <div class="toolbar-actions">
            <button id="toggleRosterBtn" class="btn-tool active" onclick="toggleSidebar()">👁️ HIDE ROSTER</button>
            <button id="btnHostile" class="btn-tool btn-threat" onclick="setQuickMarker('HOSTILE')">🔴 +HOSTILE</button>
            <button id="btnIed" class="btn-tool btn-ied" onclick="setQuickMarker('HAZARD')">⚠️ +IED</button>
            <button id="btnBreach" class="btn-tool btn-breach" onclick="setQuickMarker('BREACH')">🟢 +BREACH</button>
            <button id="measureBtn" class="btn-tool" onclick="toggleMeasureTool()">📏 MEASURE</button>
            <button id="sirenMuteBtn" class="btn-tool" onclick="toggleSirenMute()">🔔 SIREN: ON</button>
            <button class="btn-tool" onclick="clearSitRepMarkers()">🧹 CLEAR SITREPS</button>
            <button class="btn-tool btn-logout" onclick="logoutC2()">🔒 LOGOUT</button>
        </div>
    </header>

    <!-- Workspace -->
    <div class="workspace">
        <div id="tacticalMap">
            <div class="tactical-compass-hud">
                <div class="compass-dial-btn" onclick="resetNorth()" title="Click to Reset North (0°)">
                    <svg id="northNeedle" class="compass-needle-svg" viewBox="0 0 100 100" fill="none">
                        <polygon points="50,6 61,48 50,40 39,48" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
                        <polygon points="50,94 61,52 50,60 39,52" fill="#64748b" stroke="#ffffff" stroke-width="1.5" />
                        <circle cx="50" cy="50" r="4.5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
                        <text x="50" y="22" fill="#ffffff" font-size="10" font-weight="900" text-anchor="middle" font-family="monospace">N</text>
                    </svg>
                </div>
                <div id="bearingDisplay" class="compass-bearing-label">0° N</div>
                <div class="compass-actions">
                    <button class="btn-rot" onclick="rotateMapRelative(-15)" title="Rotate Counter-Clockwise 15°">⟲</button>
                    <button class="btn-rot" onclick="resetNorth()" title="Reset True North">N</button>
                    <button class="btn-rot" onclick="rotateMapRelative(15)" title="Rotate Clockwise 15°">⟳</button>
                </div>
            </div>
        </div>

        <div id="sidebarPanel" class="sidebar">
            <div class="sidebar-header">
                <span>OPERATIONAL ELEMENTS</span>
                <span id="totalUnitsBadge" style="font-size:0.75rem; color:var(--text-muted);">0 UNITS</span>
            </div>
            <div id="unitList" class="unit-list">
                <div id="emptyRosterMsg" style="color:var(--text-muted); font-size:0.8rem; text-align:center; margin-top:20px;">
                    Enter Operations Password to connect...
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyAXJsxJDkSxiYFHRKWKjPVkWSDcnAXb4_g",
            authDomain: "forceone-ops.firebaseapp.com",
            databaseURL: "https://forceone-ops-default-rtdb.firebaseio.com",
            projectId: "forceone-ops",
            storageBucket: "forceone-ops.firebasestorage.app",
            messagingSenderId: "1035569483131",
            appId: "1:1035569483131:web:ca675d22897f344f2ac1de"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // --- 2. MAP INITIALIZATION ---
        const map = L.map('tacticalMap', { 
            zoomControl: false,
            rotate: true,
            bearing: 0,
            touchRotate: true,
            shiftKeyRotate: true
        }).setView([19.143896, 72.870933], 15);
        
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        const tacticalDarkLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            className: 'dark-tiles',
            attribution: 'Tactical Grid'
        }).addTo(map);

        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Esri Satellite'
        });

        L.control.layers({
            "Dark Tactical Map": tacticalDarkLayer,
            "Satellite Imagery": satelliteLayer
        }, null, { position: 'topright' }).addTo(map);

        // --- 3. STORAGE & TRACKING STATE ---
        const markers = {};          
        const markerHtmlCache = {};  
        const accuracyCircles = {};  
        const unitSegments = {};     
        const lastPositions = {};    
        const situationMarkers = []; 
        let latestCasualtyLatLng = null;

        let telemetryRef = null;
        let isListening = false;
        let staleTimer = null;
        const knownUnits = {};       
        const STOP_STATUSES = ["STOPPED", "ENDED"]; 
        const STALE_MS = 30000;      
        
        const DASHBOARD_PASSWORD = "Forceone@123";

        // WebRTC & Audio Settings
        const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
        let activePeerConnection = null;
        let currentListeningUnit = null;
        let candidatesListenerRef = null;
        let isSirenMuted = false;
        let audioCtx = null;
        let isSirenPlaying = false;
        let activeSirenOsc = null;
        let audioSourceNode = null;
        const activeCasualties = new Set();
        let isInitialLoginLoad = true;

        let activePlacementType = null;

        document.addEventListener('click', () => {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        });

        // Quick Keyboard Shortcut: Press 'R' to toggle roster anytime
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'r' && document.activeElement.tagName !== 'INPUT') {
                toggleSidebar();
            }
        });

        // --- 4. MAP ROTATION & NORTH ARROW ENGINE ---
        function updateNorthCompass(deg) {
            const normalized = ((Math.round(deg) % 360) + 360) % 360;
            const needle = document.getElementById("northNeedle");
            const label = document.getElementById("bearingDisplay");
            
            if (needle) needle.style.transform = `rotate(${-normalized}deg)`;

            if (label) {
                let dir = "N";
                if (normalized >= 23 && normalized < 68) dir = "NE";
                else if (normalized >= 68 && normalized < 113) dir = "E";
                else if (normalized >= 113 && normalized < 158) dir = "SE";
                else if (normalized >= 158 && normalized < 203) dir = "S";
                else if (normalized >= 203 && normalized < 248) dir = "SW";
                else if (normalized >= 248 && normalized < 293) dir = "W";
                else if (normalized >= 293 && normalized < 338) dir = "NW";
                label.innerText = `${normalized}° ${dir}`;
            }
        }

        map.on('rotate', () => {
            if (typeof map.getBearing === 'function') updateNorthCompass(map.getBearing());
        });

        function rotateMapRelative(delta) {
            if (typeof map.setBearing === 'function' && typeof map.getBearing === 'function') {
                const current = map.getBearing() || 0;
                map.setBearing(current + delta);
                updateNorthCompass(current + delta);
            }
        }

        function resetNorth() {
            if (typeof map.setBearing === 'function') {
                map.setBearing(0);
                updateNorthCompass(0);
            }
        }

        // --- 5. TOGGLE ROSTER ---
        function toggleSidebar() {
            const sidebar = document.getElementById("sidebarPanel");
            const btn = document.getElementById("toggleRosterBtn");
            const isHidden = sidebar.style.display === "none";

            if (isHidden) {
                sidebar.style.display = "flex";
                btn.innerText = "👁️ HIDE ROSTER";
                btn.classList.add("active");
            } else {
                sidebar.style.display = "none";
                btn.innerText = "👁️ SHOW ROSTER";
                btn.classList.remove("active");
            }

            setTimeout(() => { map.invalidateSize(); }, 150);
        }

        // --- 6. AUTHENTICATION & SESSION MANAGEMENT ---
        function verifyAccess() {
            const enteredPassword = document.getElementById("c2Password").value;
            if (enteredPassword === DASHBOARD_PASSWORD) {
                document.getElementById("authOverlay").style.display = "none";
                document.getElementById("c2Password").value = "";

                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                cleanEntireMapAndDashboard();
                isInitialLoginLoad = true;

                startListeningTelemetry();
            } else {
                alert("ACCESS DENIED: Invalid Tactical Password");
            }
        }

        function cleanEntireMapAndDashboard() {
            Object.keys(markers).forEach(k => removeUnitFromMap(k));
            Object.keys(knownUnits).forEach(k => delete knownUnits[k]);
            
            const unitListEl = document.getElementById("unitList");
            if (unitListEl) unitListEl.innerHTML = "";
            
            document.getElementById("onlineCount").innerText = "0";
            document.getElementById("casualtyCount").innerText = "0";
            document.getElementById("staleCount").innerText = "0";
            document.getElementById("totalUnitsBadge").innerText = "0 UNITS";
            document.getElementById("casualtyNoticeBar").style.display = "none";
        }

        function logoutC2() {
            if (telemetryRef) {
                telemetryRef.off();
                telemetryRef = null;
            }
            if (staleTimer) {
                clearInterval(staleTimer);
                staleTimer = null;
            }
            isListening = false;

            cleanEntireMapAndDashboard();
            clearSitRepMarkers();

            if (measureLine) {
                map.removeLayer(measureLine);
                measureLine = null;
            }
            measureActive = false;
            document.getElementById("measureBtn").classList.remove("active");
            document.getElementById("measureBtn").innerText = "📏 MEASURE";

            stopAudioMonitoring();

            activeCasualties.clear();
            if (activeSirenOsc) {
                try { activeSirenOsc.stop(); } catch (e) {}
                activeSirenOsc = null;
            }
            isSirenPlaying = false;

            resetNorth();
            resetPlacementState();

            const sidebar = document.getElementById("sidebarPanel");
            sidebar.style.display = "flex";
            const btn = document.getElementById("toggleRosterBtn");
            btn.innerText = "👁️ HIDE ROSTER";
            btn.classList.add("active");

            document.getElementById("unitList").innerHTML = `
                <div style="color:var(--text-muted); font-size:0.8rem; text-align:center; margin-top:20px;">
                    Session locked. Enter Password to view telemetry.
                </div>
            `;

            document.getElementById("authOverlay").style.display = "flex";
        }

        // --- 7. TELEMETRY & SORTED ROSTER ENGINE ---
        function startListeningTelemetry() {
            if (isListening) return;
            isListening = true;

            telemetryRef = database.ref("commandos");
            telemetryRef.on("value", (snapshot) => {
                const incomingData = snapshot.val() || {};
                const now = Date.now();

                Object.keys(incomingData).forEach((k) => {
                    const u = incomingData[k];
                    if (!u) return;

                    const ageMs = now - (u.lastUpdated || 0);
                    const isLive = (u.status === "ONLINE" && ageMs <= STALE_MS);

                    if (isInitialLoginLoad && !isLive) {
                        return;
                    }

                    knownUnits[k] = u;
                });

                renderTelemetry();
                isInitialLoginLoad = false;
            });

            if (staleTimer) clearInterval(staleTimer);
            staleTimer = setInterval(renderTelemetry, 4000);
        }

        function removeUnitFromMap(k) {
            if (markers[k]) { map.removeLayer(markers[k]); delete markers[k]; }
            delete markerHtmlCache[k];
            if (accuracyCircles[k]) { map.removeLayer(accuracyCircles[k]); delete accuracyCircles[k]; }
            if (unitSegments[k]) { unitSegments[k].forEach(seg => map.removeLayer(seg)); delete unitSegments[k]; }
            delete lastPositions[k];
            activeCasualties.delete(k);

            const card = document.getElementById(`unit_card_${k}`);
            if (card && card.parentNode) card.parentNode.removeChild(card);
        }

        function renderTelemetry() {
            if (!isListening) return;

            const data = knownUnits;
            const now = Date.now();
            const unitListEl = document.getElementById("unitList");

            // Deduplication by callsign
            const bestKeyById = {};
            Object.keys(data).forEach((key) => {
                const u = data[key];
                if (!u) return;
                const normalizedId = String(u.callsign || key).trim().toLowerCase();
                const existingKey = bestKeyById[normalizedId];
                if (!existingKey || (u.lastUpdated || 0) > ((data[existingKey] && data[existingKey].lastUpdated) || 0)) {
                    bestKeyById[normalizedId] = key;
                }
            });

            const uniqueActiveKeys = new Set(Object.values(bestKeyById));

            Object.keys(data).forEach(k => {
                if (!uniqueActiveKeys.has(k)) {
                    delete data[k];
                    removeUnitFromMap(k);
                }
            });

            uniqueActiveKeys.forEach((key) => {
                const unit = data[key];
                if (unit && (STOP_STATUSES.includes(unit.status) || unit.sessionEnded === true)) {
                    delete knownUnits[key];
                    removeUnitFromMap(key);
                    uniqueActiveKeys.delete(key);
                }
            });

            const sortedKeys = Array.from(uniqueActiveKeys);

            sortedKeys.sort((a, b) => {
                const uA = data[a];
                const uB = data[b];
                const ageA = now - (uA.lastUpdated || 0);
                const ageB = now - (uB.lastUpdated || 0);
                const isLiveA = (uA.status === "ONLINE" && ageA <= STALE_MS);
                const isLiveB = (uB.status === "ONLINE" && ageB <= STALE_MS);
                const isCasA = !!uA.casualty;
                const isCasB = !!uB.casualty;

                const getRank = (isCas, isLive, u) => {
                    if (isCas) return 0;
                    if (isLive) return 1;
                    if (u.status === "ONLINE" || u.status === "STALE") return 2;
                    return 3;
                };

                const rankA = getRank(isCasA, isLiveA, uA);
                const rankB = getRank(isCasB, isLiveB, uB);

                if (rankA !== rankB) return rankA - rankB;

                const nameA = String(uA.callsign || a).toLowerCase();
                const nameB = String(uB.callsign || b).toLowerCase();
                return nameA.localeCompare(nameB);
            });

            let onlineCount = 0;
            let casualtyCount = 0;
            let staleCount = 0;

            sortedKeys.forEach((key) => {
                const unit = data[key];
                const isCasualty = !!unit.casualty;
                const ageMs = now - (unit.lastUpdated || 0);
                const isLive = (unit.status === "ONLINE" && ageMs <= STALE_MS);
                const isGpsLost = (unit.status === "ONLINE" && !isLive) || unit.status === "STALE";
                const isOffline = !isLive && !isGpsLost;

                if (isLive) onlineCount++;
                else if (isGpsLost) staleCount++;

                if (isCasualty) {
                    casualtyCount++;
                    if (unit.lat && unit.lng) latestCasualtyLatLng = [unit.lat, unit.lng];

                    if (!activeCasualties.has(key)) {
                        activeCasualties.add(key);
                        if (!isInitialLoginLoad && !isSirenMuted) {
                            playDistressSiren();
                        }
                    }
                } else {
                    activeCasualties.delete(key);
                }

                const ageSec = Math.max(0, Math.round(ageMs / 1000));
                const ageText = ageSec < 60 ? `${ageSec}s` : `${Math.floor(ageSec / 60)}m`;

                // --- MAP MARKERS & PATHS ---
                if (unit.lat && unit.lng) {
                    const latLng = [unit.lat, unit.lng];
                    
                    // Cap accuracy radius to 35m max
                    const accRadius = Math.min(Math.max(unit.accuracy || 5, 2), 35);

                    let markerClass = "marker-online";
                    let markerBg = "var(--color-online)";
                    let statusLabelText = "ONLINE";

                    if (isCasualty) {
                        markerClass = "marker-casualty";
                        markerBg = "var(--color-distress)";
                        statusLabelText = "DISTRESS / CASUALTY";
                    } else if (isGpsLost) {
                        markerClass = "marker-stale";
                        markerBg = "var(--color-gps-lost)";
                        statusLabelText = `GPS LOST (${ageText})`;
                    } else if (isOffline) {
                        markerClass = "marker-offline";
                        markerBg = "var(--color-offline)";
                        statusLabelText = "OFFLINE";
                    }

                    const initials = String(unit.callsign || key).substring(0, 2).toUpperCase();
                    const markerHtml = `<div class="commando-marker ${markerClass}" style="background:${markerBg};">${initials}</div>`;
                    const popupHtml = `<strong>${unit.callsign || key}</strong><br>Status: ${statusLabelText}<br>Acc: ±${(unit.accuracy || 5).toFixed(1)}m`;

                    if (!markers[key]) {
                        markers[key] = L.marker(latLng, { 
                            icon: L.divIcon({ html: markerHtml, className: '', iconSize: [28, 28] }) 
                        }).addTo(map);
                        markers[key].bindPopup(popupHtml);
                        markerHtmlCache[key] = markerHtml;
                    } else {
                        markers[key].setLatLng(latLng);
                        if (markerHtmlCache[key] !== markerHtml) {
                            markers[key].setIcon(L.divIcon({ html: markerHtml, className: '', iconSize: [28, 28] }));
                            markerHtmlCache[key] = markerHtml;
                        }
                        markers[key].getPopup().setContent(popupHtml);
                    }

                    // Accuracy Circle: Only visible when live
                    if (isLive) {
                        const circleColor = isCasualty ? '#dc2626' : '#15803d';
                        const circleOpacity = 0.12;

                        if (!accuracyCircles[key]) {
                            accuracyCircles[key] = L.circle(latLng, {
                                radius: accRadius,
                                color: circleColor,
                                weight: 1,
                                fillOpacity: circleOpacity,
                                fillColor: circleColor
                            }).addTo(map);
                        } else {
                            accuracyCircles[key].setLatLng(latLng);
                            accuracyCircles[key].setRadius(accRadius);
                            accuracyCircles[key].setStyle({
                                color: circleColor,
                                fillColor: circleColor,
                                fillOpacity: circleOpacity
                            });
                        }
                    } else {
                        if (accuracyCircles[key]) {
                            map.removeLayer(accuracyCircles[key]);
                            delete accuracyCircles[key];
                        }
                    }

                    // Traveled paths
                    if (!unitSegments[key]) unitSegments[key] = [];

                    if (lastPositions[key]) {
                        if (isLive || isCasualty) {
                            const prevLatLng = lastPositions[key];
                            const distanceMoved = map.distance(prevLatLng, latLng);
                            const minMoveThreshold = Math.max(2.5, accRadius * 0.4);

                            if (distanceMoved >= minMoveThreshold) {
                                const pathColor = isCasualty ? '#ef4444' : '#38bdf8';
                                const segment = L.polyline([prevLatLng, latLng], {
                                    color: pathColor,
                                    weight: 3,
                                    opacity: 0.35
                                }).addTo(map);

                                unitSegments[key].push(segment);
                                if (unitSegments[key].length > 60) {
                                    const oldest = unitSegments[key].shift();
                                    map.removeLayer(oldest);
                                }
                                lastPositions[key] = latLng;
                            }
                        }
                    } else {
                        lastPositions[key] = latLng;
                    }
                }

                // In-place roster update
                let card = document.getElementById(`unit_card_${key}`);
                if (!card) {
                    card = document.createElement("div");
                    card.id = `unit_card_${key}`;
                    card.setAttribute("data-key", key);
                    unitListEl.appendChild(card);
                }

                unitListEl.appendChild(card);

                let cardClass = "card-online";
                let statusBadgeText = "● ONLINE";
                let statusBadgeColor = "var(--color-online)";

                if (isCasualty) {
                    cardClass = "card-casualty";
                    statusBadgeText = "🚨 CASUALTY";
                    statusBadgeColor = "var(--color-distress)";
                } else if (isGpsLost) {
                    cardClass = "card-stale";
                    statusBadgeText = `⚠ GPS LOST · ${ageText}`;
                    statusBadgeColor = "#ca8a04";
                } else if (isOffline) {
                    cardClass = "card-offline";
                    statusBadgeText = "OFFLINE";
                    statusBadgeColor = "#64748b";
                }

                card.className = `unit-card ${cardClass}`;
                
                // Clicking a unit card focuses the map WITHOUT auto-hiding the roster
                card.onclick = () => { 
                    if (unit.lat && unit.lng) {
                        map.setView([unit.lat, unit.lng], 17);
                    }
                };

                const headingDeg = Math.round(unit.heading || 0);

                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong style="color:#fff;">${unit.callsign || key}</strong>
                        <span style="font-size:0.75rem; font-weight:bold; color:${statusBadgeColor}">
                            ${statusBadgeText}
                        </span>
                    </div>
                    <div style="font-size:0.7rem; color:var(--text-muted); margin-top:4px;">
                        ACC: ±${unit.accuracy ? unit.accuracy.toFixed(1) : 0}m | HDG: ${headingDeg}° | GRP: ${unit.group || 'N/A'}
                    </div>
                    ${unit.audioActive ? `
                        <button id="audioBtn_${key}" class="btn-listen ${currentListeningUnit === key ? 'monitoring' : ''}" 
                                onclick="event.stopPropagation(); toggleAudioListen('${key}')">
                            ${currentListeningUnit === key ? '🔊 SPEAKER: ON (MUTE)' : '🎙️ TURN SPEAKER ON (LISTEN)'}
                        </button>
                    ` : ''}
                `;
            });

            Array.from(unitListEl.children).forEach(child => {
                const cardKey = child.getAttribute("data-key");
                if (cardKey && !uniqueActiveKeys.has(cardKey)) {
                    unitListEl.removeChild(child);
                }
            });

            document.getElementById("onlineCount").innerText = onlineCount;
            document.getElementById("casualtyCount").innerText = casualtyCount;
            document.getElementById("staleCount").innerText = staleCount;
            document.getElementById("totalUnitsBadge").innerText = `${sortedKeys.length} UNITS`;
            document.getElementById("casualtyNoticeBar").style.display = casualtyCount > 0 ? "flex" : "none";
        }

        // Focus casualty WITHOUT closing the sidebar
        function focusLatestCasualty() {
            if (latestCasualtyLatLng) {
                map.setView(latestCasualtyLatLng, 18);
            }
        }

        // --- 8. TACTICAL DISTRESS SIREN (NO BLINKING) ---
        function playDistressSiren() {
            if (isSirenMuted || isSirenPlaying) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') return;

                isSirenPlaying = true;
                const t = audioCtx.currentTime;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                activeSirenOsc = osc;
                osc.type = "sawtooth";

                for (let i = 0; i < 5; i++) {
                    const step = i * 0.6;
                    osc.frequency.setValueAtTime(850, t + step);
                    osc.frequency.exponentialRampToValueAtTime(420, t + step + 0.3);
                    osc.frequency.exponentialRampToValueAtTime(850, t + step + 0.6);
                }

                gain.gain.setValueAtTime(0.25, t);
                gain.gain.setValueAtTime(0.25, t + 2.7);
                gain.gain.linearRampToValueAtTime(0.001, t + 3.0);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(t);
                osc.stop(t + 3.0);

                setTimeout(() => {
                    isSirenPlaying = false;
                    activeSirenOsc = null;
                }, 3000);
            } catch (e) {
                isSirenPlaying = false;
                activeSirenOsc = null;
            }
        }

        function toggleSirenMute() {
            isSirenMuted = !isSirenMuted;
            const btn = document.getElementById("sirenMuteBtn");
            if (isSirenMuted) {
                btn.innerText = "🔕 SIREN: OFF";
                btn.classList.add("active");
                if (activeSirenOsc) {
                    try { activeSirenOsc.stop(); } catch (e) {}
                    activeSirenOsc = null;
                }
                isSirenPlaying = false;
            } else {
                btn.innerText = "🔔 SIREN: ON";
                btn.classList.remove("active");
            }
        }

        // --- 9. AUDIO INTERCEPT (WebRTC) ---
        async function toggleAudioListen(unitKey) {
            const player = document.getElementById("remoteAudioPlayer");

            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();

            if (currentListeningUnit === unitKey) {
                stopAudioMonitoring();
                return;
            }

            stopAudioMonitoring();

            currentListeningUnit = unitKey;
            const btn = document.getElementById(`audioBtn_${unitKey}`);
            if (btn) {
                btn.classList.add("monitoring");
                btn.innerText = "⏳ CONNECTING...";
            }

            try {
                await database.ref(`webrtc/${unitKey}/m_candidates`).remove();
                await database.ref(`webrtc/${unitKey}/answer`).remove();

                const pc = new RTCPeerConnection(rtcConfig);
                activePeerConnection = pc;

                pc.addTransceiver('audio', { direction: 'recvonly' });

                pc.ontrack = (event) => {
                    const stream = (event.streams && event.streams[0]) 
                        ? event.streams[0] 
                        : new MediaStream([event.track]);

                    player.srcObject = stream;
                    player.muted = false;
                    player.volume = 1.0;
                    player.play().catch(e => console.warn("Autoplay warning:", e));

                    try {
                        if (audioSourceNode) audioSourceNode.disconnect();
                        audioSourceNode = audioCtx.createMediaStreamSource(stream);
                        audioSourceNode.connect(audioCtx.destination);
                    } catch (err) {}

                    if (btn) {
                        btn.classList.add("monitoring");
                        btn.innerText = "🔊 SPEAKER: ON (MUTE)";
                    }
                };

                pc.oniceconnectionstatechange = () => {
                    if (pc.iceConnectionState === "failed" || pc.iceConnectionState === "disconnected") {
                        if (btn && currentListeningUnit === unitKey) {
                            btn.innerText = "⚠️ RECONNECTING...";
                        }
                    }
                };

                pc.onicecandidate = (event) => {
                    if (event.candidate && pc.signalingState !== "closed") {
                        database.ref(`webrtc/${unitKey}/m_candidates`).push(event.candidate.toJSON());
                    }
                };

                const offerSnap = await database.ref(`webrtc/${unitKey}/offer`).get();
                const offer = offerSnap.val();
                if (!offer) {
                    alert("Audio stream not ready or commando offline.");
                    stopAudioMonitoring();
                    return;
                }

                await pc.setRemoteDescription(new RTCSessionDescription(offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                await database.ref(`webrtc/${unitKey}/answer`).set({ sdp: answer.sdp, type: answer.type });

                candidatesListenerRef = database.ref(`webrtc/${unitKey}/c_candidates`);
                candidatesListenerRef.on("child_added", async (snap) => {
                    const candidate = snap.val();
                    if (candidate && pc && pc.signalingState !== "closed" && pc.remoteDescription) {
                        try {
                            await pc.addIceCandidate(new RTCIceCandidate(candidate));
                        } catch (err) {}
                    }
                });
            } catch (err) {
                alert("Failed to establish audio link: " + err.message);
                stopAudioMonitoring();
            }
        }

        function stopAudioMonitoring() {
            if (candidatesListenerRef) {
                candidatesListenerRef.off();
                candidatesListenerRef = null;
            }
            if (audioSourceNode) {
                try { audioSourceNode.disconnect(); } catch (e) {}
                audioSourceNode = null;
            }
            if (activePeerConnection) {
                activePeerConnection.close();
                activePeerConnection = null;
            }
            const player = document.getElementById("remoteAudioPlayer");
            if (player) {
                player.srcObject = null;
                player.pause();
            }

            if (currentListeningUnit) {
                const btn = document.getElementById(`audioBtn_${currentListeningUnit}`);
                if (btn) {
                    btn.classList.remove("monitoring");
                    btn.innerText = "🎙️ TURN SPEAKER ON (LISTEN)";
                }
                currentListeningUnit = null;
            }
        }

        // --- 10. SITREP MARKERS ---
        function setQuickMarker(type) {
            if (activePlacementType === type) {
                resetPlacementState();
            } else {
                resetPlacementState();
                activePlacementType = type;
                if (type === 'HOSTILE') document.getElementById("btnHostile").classList.add("active");
                if (type === 'HAZARD') document.getElementById("btnIed").classList.add("active");
                if (type === 'BREACH') document.getElementById("btnBreach").classList.add("active");
            }
        }

        function resetPlacementState() {
            activePlacementType = null;
            document.getElementById("btnHostile").classList.remove("active");
            document.getElementById("btnIed").classList.remove("active");
            document.getElementById("btnBreach").classList.remove("active");
        }

        function placeSitRep(latlng, type) {
            let label = "PIN";
            let color = "#ef4444";
            if (type === "HOSTILE") { label = "HOSTILE"; color = "#dc2626"; }
            else if (type === "BREACH") { label = "BREACH"; color = "#16a34a"; }
            else if (type === "HAZARD") { label = "IED / HAZARD"; color = "#d97706"; }

            const pinIcon = L.divIcon({
                html: `<div style="background:${color}; color:#fff; font-size:10px; font-weight:bold; padding:3px 6px; border-radius:4px; border:1px solid #fff; box-shadow:0 0 8px rgba(0,0,0,0.8);">${label}</div>`,
                className: '',
                iconSize: [80, 20]
            });
            const sitMarker = L.marker(latlng, { icon: pinIcon }).addTo(map)
                .bindPopup(`<strong>${label}</strong><br>LAT: ${latlng.lat.toFixed(6)}<br>LNG: ${latlng.lng.toFixed(6)}`);
            
            situationMarkers.push(sitMarker);
        }

        map.on('contextmenu', (e) => {
            const pinType = prompt("SELECT SITREP MARKER:\n1 = 🔴 Hostile / Terrorist\n2 = 🟢 Breach / Entry Point\n3 = ⚠️ IED / Hazard Zone", "1");
            if (!pinType) return;

            let type = "HOSTILE";
            if (pinType === "1") type = "HOSTILE";
            else if (pinType === "2") type = "BREACH";
            else if (pinType === "3") type = "HAZARD";

            placeSitRep(e.latlng, type);
        });

        function clearSitRepMarkers() {
            situationMarkers.forEach(marker => map.removeLayer(marker));
            situationMarkers.length = 0;
        }

        // --- 11. MEASUREMENT & MAP CLICKS ---
        let measureActive = false;
        let measurePoints = [];
        let measureLine = null;

        function toggleMeasureTool() {
            resetPlacementState();
            measureActive = !measureActive;
            measurePoints = [];
            if (measureLine) { map.removeLayer(measureLine); measureLine = null; }
            document.getElementById("measureBtn").classList.toggle("active", measureActive);
            document.getElementById("measureBtn").innerText = measureActive ? "📏 2 POINTS" : "📏 MEASURE";
        }

        map.on('click', (e) => {
            if (activePlacementType) {
                placeSitRep(e.latlng, activePlacementType);
                resetPlacementState();
                return;
            }

            if (!measureActive) return;
            measurePoints.push(e.latlng);

            if (measurePoints.length === 2) {
                const dist = measurePoints[0].distanceTo(measurePoints[1]);
                measureLine = L.polyline(measurePoints, { color: '#f59e0b', weight: 3, dashArray: '5, 5' }).addTo(map);
                measureLine.bindPopup(`<strong>SEPARATION:</strong> ${dist.toFixed(1)} meters`).openPopup();
                measureActive = false;
                document.getElementById("measureBtn").classList.remove("active");
                document.getElementById("measureBtn").innerText = "📏 MEASURE";
            }
        });
    </script>
</body>
