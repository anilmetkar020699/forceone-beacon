<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Force One - Tactical C2 Dashboard</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-dark: #0a0e17;
            --panel-bg: #111827;
            --border: #1e293b;
            
            /* Status Colors */
            --color-online: #15803d;             /* Dark Green */
            --color-relay: #f59e0b;              /* Amber / BLE Proximity Relay */
            --color-offline: rgba(148, 163, 184, 0.45); /* Muted Slate */
            --color-gps-lost: rgba(234, 179, 8, 0.65);  /* Warning Amber */
            --color-distress: #dc2626;           /* Solid Red */
            
            --accent-blue: #38bdf8;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, -apple-system, sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* Security Authorization Overlay */
        #authOverlay {
            position: fixed; inset: 0; background: rgba(8, 12, 20, 0.98); 
            z-index: 9999; display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(8px);
        }
        .auth-card {
            background: #111827; border: 1px solid #334155; padding: 36px 30px; 
            border-radius: 12px; width: 360px; max-width: 90vw; text-align: center; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9), 0 0 20px rgba(56, 189, 248, 0.15);
        }
        
        .auth-logo-svg {
            width: 84px; height: 84px; margin: 0 auto 10px auto; display: block;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.35));
        }
        .auth-welcome-title {
            font-size: 1.85rem; font-weight: 900; letter-spacing: 3px; 
            color: #ffffff; text-transform: uppercase; margin-top: 6px;
        }
        .auth-subtitle {
            font-size: 0.72rem; font-weight: 700; letter-spacing: 2.5px; 
            color: var(--accent-blue); text-transform: uppercase; margin-bottom: 22px;
        }

        .auth-card input {
            width: 100%; padding: 12px 14px; margin-bottom: 16px; background: #0f172a; 
            border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 0.95rem; text-align: center;
            letter-spacing: 1px; outline: none; transition: 0.2s border;
        }
        .auth-card input:focus { border-color: var(--accent-blue); }
        .auth-card button {
            width: 100%; padding: 12px; background: var(--accent-blue); border: none; 
            border-radius: 6px; font-weight: 900; font-size: 0.9rem; letter-spacing: 1.5px; 
            cursor: pointer; color: #0a0e17; text-transform: uppercase; transition: 0.2s background;
        }
        .auth-card button:hover { background: #7dd3fc; }
        .auth-card button:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Header Operations Bar */
        header { 
            min-height: 54px; background: var(--panel-bg); border-bottom: 2px solid #334155; 
            display: flex; justify-content: space-between; align-items: center; padding: 6px 16px; 
            z-index: 1000; flex-wrap: wrap; gap: 8px;
        }
        .header-brand { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .op-title { font-weight: 900; font-size: 1.05rem; letter-spacing: 2px; color: var(--accent-blue); }
        .stat-badges { display: flex; gap: 8px; font-size: 0.8rem; font-weight: bold; }
        .badge { padding: 4px 8px; border-radius: 4px; background: #0f172a; border: 1px solid var(--border); white-space: nowrap; }

        .toolbar-actions {
            display: flex; align-items: center; gap: 4px; overflow-x: auto; 
            max-width: 100%; -webkit-overflow-scrolling: touch; scrollbar-width: none;
        }
        .toolbar-actions::-webkit-scrollbar { display: none; }

        /* Emergency Casualty Banner */
        #casualtyNoticeBar { 
            display: none; background: #7f1d1d; border-bottom: 2px solid var(--color-distress); 
            color: #fff; padding: 8px 16px; font-size: 0.85rem; font-weight: bold; 
            justify-content: space-between; align-items: center; z-index: 2000; flex-wrap: wrap; gap: 6px;
        }

        /* Tactical Squad Merge Controller Bar */
        .hit-merge-bar {
            background: #0b1324; border-bottom: 2px solid #1e293b; padding: 6px 16px;
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            flex-wrap: wrap; z-index: 995;
        }
        .merge-controls-left {
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        }
        .merge-label {
            font-size: 0.75rem; font-weight: 900; letter-spacing: 1.5px;
            color: var(--accent-blue); white-space: nowrap;
        }
        .merge-select {
            background: #1e293b; color: #fff; border: 1px solid #334155;
            border-radius: 4px; padding: 5px 10px; font-size: 0.75rem;
            font-family: monospace; outline: none; cursor: pointer;
        }
        .merge-select:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn-merge-action {
            background: #0284c7; color: #fff; font-weight: 900;
            border-color: #38bdf8; padding: 5px 12px; cursor: pointer;
            border-radius: 4px; font-size: 0.75rem;
        }
        .btn-merge-action.active-unmerge {
            background: #d97706; color: #fff; border-color: #f59e0b;
        }
        .active-merged-badges {
            display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
        }
        .merged-badge-tag {
            background: #1e1b4b; border: 1px solid #6366f1; color: #c7d2fe;
            font-size: 0.7rem; font-weight: bold; padding: 3px 8px;
            border-radius: 4px; display: inline-flex; align-items: center; gap: 6px;
        }
        .merged-badge-tag button {
            background: #ef4444; border: none; color: #fff; font-weight: 900;
            cursor: pointer; font-size: 0.65rem; padding: 1px 4px; border-radius: 2px;
        }

        /* Workspace Grid */
        .workspace { flex: 1; display: flex; position: relative; overflow: hidden; width: 100%; }
        #tacticalMap { flex: 1; height: 100%; width: 100%; background: #000; }

        /* Compass HUD */
        .tactical-compass-hud {
            position: absolute; top: 14px; left: 14px; z-index: 1000;
            background: rgba(15, 23, 42, 0.85); border: 1px solid var(--border);
            border-radius: 8px; padding: 6px; display: flex; flex-direction: column;
            align-items: center; gap: 5px; backdrop-filter: blur(6px);
            box-shadow: 0 4px 14px rgba(0,0,0,0.6); user-select: none;
        }
        .compass-dial-btn {
            width: 44px; height: 44px; border-radius: 50%; background: #1e293b;
            border: 2px solid #334155; cursor: pointer; display: flex;
            align-items: center; justify-content: center; position: relative;
        }
        .compass-needle-svg { width: 32px; height: 32px; transition: transform 0.2s ease-out; }
        .compass-bearing-label { font-size: 0.65rem; font-weight: 900; color: var(--accent-blue); letter-spacing: 1px; }
        .compass-actions { display: flex; gap: 3px; }
        .btn-rot {
            background: #1e293b; color: #fff; border: 1px solid var(--border);
            border-radius: 4px; font-size: 0.7rem; font-weight: bold;
            padding: 3px 6px; cursor: pointer; transition: 0.15s;
        }
        .btn-rot:hover { background: var(--accent-blue); color: #000; }

        /* Sidebar Roster */
        .sidebar { 
            width: 350px; background: var(--panel-bg); border-left: 2px solid var(--border); 
            display: flex; flex-direction: column; transition: all 0.2s ease-in-out; z-index: 1050;
        }
        .sidebar-header { 
            padding: 12px 16px; border-bottom: 1px solid var(--border); 
            font-size: 0.85rem; font-weight: bold; color: var(--accent-blue); 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .unit-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }

        /* Commando Cards */
        .unit-card { 
            background: #0f172a; border: 1px solid var(--border); border-radius: 6px; 
            padding: 10px; cursor: pointer; transition: border-color 0.2s, background 0.2s, transform 0.15s;
        }
        .unit-card:hover {
            transform: translateX(-2px);
        }
        
        /* State Card Styles */
        .unit-card.card-online {
            border: 1px solid var(--color-online);
            border-left: 4px solid var(--color-online);
            background: #0f172a;
        }
        .unit-card.card-relay {
            border: 1px solid var(--color-relay);
            border-left: 4px solid var(--color-relay);
            background: rgba(245, 158, 11, 0.12);
        }
        .unit-card.card-casualty {
            border: 2px solid var(--color-distress);
            background: rgba(127, 29, 29, 0.35);
        }
        .unit-card.card-stale {
            border: 1px solid var(--color-gps-lost);
            background: rgba(30, 27, 75, 0.25);
            opacity: 0.85;
        }
        .unit-card.card-offline {
            border: 1px solid var(--color-offline);
            background: rgba(15, 23, 42, 0.35);
            opacity: 0.45;
            color: #64748b;
        }

        /* Merged Squad Card */
        .unit-card.card-merged-squad {
            background: #0f1c30;
            border: 1px solid #38bdf8;
            border-left: 5px solid #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);
        }
        .unit-card.card-merged-squad.casualty {
            border: 2px solid var(--color-distress);
            border-left: 5px solid var(--color-distress);
            background: rgba(127, 29, 29, 0.4);
        }

        .btn-listen { 
            width: 100%; margin-top: 8px; padding: 8px; font-size: 0.75rem; font-weight: bold; 
            border: none; border-radius: 4px; cursor: pointer; background: #dc2626; color: #fff; 
        }
        .btn-listen.monitoring { background: var(--color-online); color: #fff; }

        .btn-tool {
            background: #1e293b; color: #fff; border: 1px solid var(--border); 
            padding: 6px 10px; font-size: 0.72rem; border-radius: 4px; cursor: pointer; 
            white-space: nowrap; flex-shrink: 0;
        }
        .btn-tool.active { background: var(--accent-blue); color: #000; font-weight: bold; }
        .btn-tool.btn-threat { border-color: #dc2626; color: #fca5a5; }
        .btn-tool.btn-threat.active { background: #dc2626; color: #fff; font-weight: bold; }
        .btn-tool.btn-ied { border-color: #d97706; color: #fde68a; }
        .btn-tool.btn-ied.active { background: #d97706; color: #000; font-weight: bold; }
        .btn-breach { border-color: #16a34a; color: #86efac; }
        .btn-breach.active { background: #16a34a; color: #fff; font-weight: bold; }
        .btn-purge { border-color: #f59e0b; color: #fef08a; }
        .btn-logout { background: #dc2626; border-color: #ef4444; font-weight: bold; }

        /* Tactical Markers */
        .commando-marker {
            width: 28px; height: 28px; border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; font-size: 11px; 
            font-weight: 900; color: #fff; border: 2px solid #fff; box-shadow: 0 0 10px rgba(0,0,0,0.8);
            transition: transform 0.2s ease-out;
        }
        .commando-marker.marker-online {
            background: var(--color-online) !important;
            border-color: #86efac;
        }
        .commando-marker.marker-relay {
            background: var(--color-relay) !important;
            border-color: #fde68a;
            box-shadow: 0 0 14px rgba(245, 158, 11, 0.85);
        }
        .commando-marker.marker-casualty { 
            background: var(--color-distress) !important; 
            border-color: #ffffff;
        }
        .commando-marker.marker-stale {
            background: var(--color-gps-lost) !important;
            border-color: #fef08a;
            opacity: 0.8;
        }
        .commando-marker.marker-offline {
            background: var(--color-offline) !important;
            border-color: #64748b;
            opacity: 0.35;
        }

        /* Merged Squad Map Marker */
        .merged-squad-marker {
            min-width: 58px; height: 32px; padding: 2px 6px; border-radius: 6px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 9px; font-weight: 900; color: #fff; border: 2px solid #fff;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.8); background: #0284c7;
            text-align: center; white-space: nowrap;
        }
        .merged-squad-marker.marker-online {
            background: #15803d !important;
            border-color: #86efac;
        }
        .merged-squad-marker.marker-relay {
            background: #d97706 !important;
            border-color: #fde68a;
            box-shadow: 0 0 15px rgba(217, 119, 6, 0.85);
        }
        .merged-squad-marker.marker-casualty {
            background: #dc2626 !important;
            border-color: #ffffff !important;
            box-shadow: 0 0 20px rgba(220, 38, 38, 1);
            animation: targetPing 1.2s infinite;
        }
        .merged-squad-marker.marker-stale {
            background: #ca8a04 !important;
            border-color: #fef08a;
            opacity: 0.85;
        }
        .merged-squad-marker.marker-offline {
            background: #475569 !important;
            border-color: #94a3b8;
            opacity: 0.45;
        }

        /* Marker Focus Radar Ping Animation */
        @keyframes targetPing {
            0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.95), 0 0 10px rgba(0,0,0,0.8); }
            70% { box-shadow: 0 0 0 28px rgba(56, 189, 248, 0), 0 0 15px rgba(56, 189, 248, 0.3); }
            100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0), 0 0 10px rgba(0,0,0,0.8); }
        }

        .commando-marker.marker-focused,
        .merged-squad-marker.marker-focused {
            animation: targetPing 1.2s ease-out 2;
            border-color: #38bdf8 !important;
            transform: scale(1.15);
        }

        .dark-tiles { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }

        @media (max-width: 768px) {
            header { padding: 6px 10px; }
            .op-title { font-size: 0.85rem; letter-spacing: 1.5px; }
            .stat-badges { font-size: 0.7rem; gap: 4px; }
            .badge { padding: 2px 6px; }
            .toolbar-actions { width: 100%; overflow-x: auto; padding: 2px 0; }
            .sidebar {
                position: absolute; top: 0; right: 0; bottom: 0; width: 86vw; max-width: 350px;
                box-shadow: -10px 0 30px rgba(0, 0, 0, 0.85);
            }
            .tactical-compass-hud { top: 10px; left: 10px; padding: 4px; }
            .hit-merge-bar { padding: 6px 10px; }
        }
    </style>

    <!-- Leaflet & Leaflet-Rotate SDKs -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
    
    <!-- Firebase App, Database & Auth SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>

    <!-- Remote Audio Player for Casualty Audio Intercept -->
    <audio id="remoteAudioPlayer" autoplay playsinline></audio>

    <!-- Security Authorization Screen (Password Only) -->
    <div id="authOverlay">
        <div class="auth-card">
            <svg class="auth-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 4L12 18V50C12 73.5 50 96 50 96C50 96 88 73.5 88 50V18L50 4Z" fill="#0f172a" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
                <path d="M50 10L18 22V48C18 67 50 86 50 86C50 86 82 67 82 48V22L50 10Z" stroke="#f59e0b" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M50 18V64" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
                <path d="M43 27L50 18L57 27" fill="#ffffff"/>
                <path d="M38 48H62" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
                <path d="M47 52H53M47 57H53M47 62H53" stroke="#94a3b8" stroke-width="2"/>
                <circle cx="50" cy="68" r="3" fill="#f59e0b"/>
                <path d="M26 40L36 46L29 55L40 50" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M74 40L64 46L71 55L60 50" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M50 74L51.8 78.5L56.5 78.5L52.7 81.2L54.2 85.5L50 83L45.8 85.5L47.3 81.2L43.5 78.5L48.2 78.5L50 74Z" fill="#f59e0b"/>
            </svg>

            <div class="auth-welcome-title">WELCOME</div>
            <div class="auth-subtitle">COMMANDO TRACKING SYSTEM</div>

            <input type="password" id="c2Password" placeholder="Enter Operations Passcode" onkeydown="if(event.key==='Enter') verifyAccess()">
            <button id="loginBtn" onclick="verifyAccess()">LOGIN</button>
        </div>
    </div>

    <!-- Header Operations Bar -->
    <header>
        <div class="header-brand">
            <div class="op-title">FORCE ONE TACTICAL C2</div>
            <div class="stat-badges">
                <div class="badge" style="color:var(--color-online);">ONLINE: <span id="onlineCount">0</span></div>
                <div class="badge" style="color:var(--color-relay);">RELAYED: <span id="relayCount">0</span></div>
                <div class="badge" style="color:var(--color-distress);">CASUALTIES: <span id="casualtyCount">0</span></div>
                <div class="badge" style="color:#ca8a04;">GPS LOST: <span id="staleCount">0</span></div>
            </div>
        </div>
        <div class="toolbar-actions">
            <button id="toggleRosterBtn" class="btn-tool active" onclick="toggleSidebar()">👁️ HIDE ROSTER</button>
            <button id="toggleOfflineBtn" class="btn-tool" onclick="toggleOfflineFilter()">🟢 ONLINE ONLY: OFF</button>
            <button id="btnHostile" class="btn-tool btn-threat" onclick="setQuickMarker('HOSTILE')">🔴 +HOSTILE</button>
            <button id="btnIed" class="btn-tool btn-ied" onclick="setQuickMarker('HAZARD')">⚠️ +IED</button>
            <button id="btnBreach" class="btn-tool btn-breach" onclick="setQuickMarker('BREACH')">🟢 +BREACH</button>
            <button id="measureBtn" class="btn-tool" onclick="toggleMeasureTool()">📏 MEASURE</button>
            <button id="purgeBtn" class="btn-tool btn-purge" onclick="purgeDatabaseGhosts()">🧹 PURGE GHOSTS</button>
            <button id="sirenMuteBtn" class="btn-tool" onclick="toggleSirenMute()">🔔 SIREN: ON</button>
            <button class="btn-tool" onclick="clearSitRepMarkers()">🧹 CLEAR SITREPS</button>
            <button class="btn-tool btn-logout" onclick="logoutC2()">🔒 LOGOUT</button>
        </div>
    </header>

    <!-- Emergency Casualty Alert Banner -->
    <div id="casualtyNoticeBar">
        <span id="casualtyNoticeText">🚨 SIGNAL ALERT: CASUALTY / DISTRESS RECORDED ON GRID</span>
        <button onclick="focusLatestCasualty()" style="background:#fff; color:#000; border:none; padding:4px 10px; font-weight:bold; cursor:pointer; border-radius:4px;">FOCUS TARGET</button>
    </div>

    <!-- Tactical Squad Merge Controller Bar -->
    <div id="hitMergeBar" class="hit-merge-bar">
        <div class="merge-controls-left">
            <span class="merge-label">🎯 SQUAD MERGE:</span>
            <select id="mergeGroupSelect" class="merge-select" onchange="onMergeGroupChange()">
                <option value="">-- SELECT GROUP --</option>
                <option value="Alfa">Alfa</option>
                <option value="Bravo">Bravo</option>
                <option value="Charlie">Charlie</option>
                <option value="Delta">Delta</option>
                <option value="SOT">SOT (Special Ops Team)</option>
                <option value="Sniper">Sniper</option>
                <option value="BD">BD (Bomb Disposal)</option>
            </select>
            <select id="mergeHitSelect" class="merge-select" onchange="updateMergeBtnState()" disabled>
                <option value="">-- SELECT HIT --</option>
            </select>
            <button id="btnToggleMergeHit" class="btn-merge-action" onclick="toggleMergeCurrentHit()" disabled>⚡ MERGE HIT</button>
        </div>
        <div id="activeMergedBadges" class="active-merged-badges"></div>
    </div>

    <!-- Workspace -->
    <div class="workspace">
        <div id="tacticalMap">
            <div class="tactical-compass-hud">
                <div class="compass-dial-btn" onclick="resetNorth()" title="Click to Reset North (0°)">
                    <svg id="northNeedle" class="compass-needle-svg" viewBox="0 0 100 100" fill="none">
                        <polygon points="50,6 61,48 50,40 39,48" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
                        <polygon points="50,94 61,52 50,60 39,52" fill="#64748b" stroke="#ffffff" stroke-width="1.5" />
                        <circle cx="50" cy="50" r="4.5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
                        <text x="50" y="22" fill="#ffffff" font-size="10" font-weight="900" text-anchor="middle" font-family="monospace">N</text>
                    </svg>
                </div>
                <div id="bearingDisplay" class="compass-bearing-label">0° N</div>
                <div class="compass-actions">
                    <button class="btn-rot" onclick="rotateMapRelative(-15)" title="Rotate Counter-Clockwise 15°">⟲</button>
                    <button class="btn-rot" onclick="resetNorth()" title="Reset True North">N</button>
                    <button class="btn-rot" onclick="rotateMapRelative(15)" title="Rotate Clockwise 15°">⟳</button>
                </div>
            </div>
        </div>

        <div id="sidebarPanel" class="sidebar">
            <div class="sidebar-header">
                <span>OPERATIONAL ELEMENTS</span>
                <span id="totalUnitsBadge" style="font-size:0.75rem; color:var(--text-muted);">0 UNITS</span>
            </div>
            <div id="unitList" class="unit-list">
                <div id="emptyRosterMsg" style="color:var(--text-muted); font-size:0.8rem; text-align:center; margin-top:20px;">
                    Enter Operations Passcode to connect...
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyAXJsxJDkSxiYFHRKWKjPVkWSDcnAXb4_g",
            authDomain: "forceone-ops.firebaseapp.com",
            databaseURL: "https://forceone-ops-default-rtdb.firebaseio.com",
            projectId: "forceone-ops",
            storageBucket: "forceone-ops.firebasestorage.app",
            messagingSenderId: "1035569483131",
            appId: "1:1035569483131:web:ca675d22897f344f2ac1de"
        };

        firebase.initializeApp(firebaseConfig);

        function sanitizeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Canonical Key Normalization with COMMANDO == CDO standardization
        function getCanonicalKey(str) {
            if (!str) return '';
            let s = String(str).toLowerCase();
            s = s.replace(/commando/g, 'cdo');
            return s.replace(/[^a-z0-9]/g, '');
        }

        // Check if two tactical IDs are duplicate representations of the same commando
        function areDuplicateCallsigns(idA, idB) {
            const normA = getCanonicalKey(idA);
            const normB = getCanonicalKey(idB);
            if (!normA || !normB) return false;
            if (normA === normB) return true;
            if (normA.length >= 4 && normB.length >= 4) {
                if (normA.startsWith(normB) || normB.startsWith(normA)) {
                    return true;
                }
            }
            return false;
        }

        /**
         * Resolves the Action Group and Hit Assignment for any commando telemetry record
         */
        function parseGroupAndHit(unit, key) {
            let grp = unit.group || "";
            let hit = unit.hit || "";
            const cs = String(unit.callsign || key).toUpperCase();

            if (!grp) {
                const groups = ["ALFA", "BRAVO", "CHARLIE", "DELTA", "SOT", "SNIPER", "BD"];
                for (let g of groups) {
                    if (cs.includes(g)) {
                        grp = (g === "SOT" || g === "BD") ? g : (g.charAt(0) + g.slice(1).toLowerCase());
                        break;
                    }
                }
            }

            if (!hit) {
                const m = cs.match(/HIT[\s-]*(\d+)/);
                if (m) {
                    hit = "Hit " + m[1];
                } else {
                    const m2 = cs.match(/(INDIA[\s-]*\d+|BD[\s-]*\d+)/);
                    if (m2) hit = m2[1].replace("-", " ").trim();
                }
            }

            return { group: grp || "UNASSIGNED", hit: hit || "HIT-1" };
        }

        // --- 5. MAP ROTATION & NORTH ARROW ENGINE ---
        function updateNorthCompass(deg) {
            const normalized = ((Math.round(deg) % 360) + 360) % 360;
            const needle = document.getElementById("northNeedle");
            const label = document.getElementById("bearingDisplay");
            
            if (needle) needle.style.transform = `rotate(${-normalized}deg)`;

            if (label) {
                let dir = "N";
                if (normalized >= 23 && normalized < 68) dir = "NE";
                else if (normalized >= 68 && normalized < 113) dir = "E";
                else if (normalized >= 113 && normalized < 158) dir = "SE";
                else if (normalized >= 158 && normalized < 203) dir = "S";
                else if (normalized >= 203 && normalized < 248) dir = "SW";
                else if (normalized >= 248 && normalized < 293) dir = "W";
                else if (normalized >= 293 && normalized < 338) dir = "NW";
                label.innerText = `${normalized}° ${dir}`;
            }
        }

        map.on('rotate', () => {
            if (typeof map.getBearing === 'function') updateNorthCompass(map.getBearing());
        });

        function rotateMapRelative(delta) {
            if (typeof map.setBearing === 'function' && typeof map.getBearing === 'function') {
                const current = map.getBearing() || 0;
                map.setBearing(current + delta);
                updateNorthCompass(current + delta);
            }
        }

        function resetNorth() {

        // --- 8. TELEMETRY, MERGE ENGINE & DEDUPLICATION ---
        function startListeningTelemetry() {
            if (isListening) return;
            isListening = true;

            telemetryRef = database.ref("commandos");
            telemetryRef.on("value", (snapshot) => {
                const incomingData = snapshot.val() || {};
                const now = Date.now();

                Object.keys(incomingData).forEach((k) => {
                    const u = incomingData[k];
                    if (!u) return;

                    const ageMs = now - (u.lastUpdated || 0);
                    const isRelayed = (u.status === "RELAYED_INDOOR" || !!u.relay_by || !!u.relayBy);
                    const isLive = ((u.status === "ONLINE" || isRelayed) && ageMs <= STALE_MS);

                    if (isInitialLoginLoad && !isLive && !u.casualty) {
                        if (ageMs > GHOST_PURGE_MS) {
                            database.ref("commandos/" + k).remove().catch(() => {});
                        }
                        return;
                    }

                    knownUnits[k] = u;
                });

                Object.keys(knownUnits).forEach(k => {
                    if (!incomingData[k]) {
                        delete knownUnits[k];
                        removeUnitFromMap(k);
                    }
                });

                renderTelemetry();
                isInitialLoginLoad = false;
            }, (error) => {
                console.error("Firebase Telemetry Error:", error);
            });

            if (staleTimer) clearInterval(staleTimer);
            staleTimer = setInterval(renderTelemetry, 3000);
        }

        function removeUnitFromMap(k) {
            if (markers[k]) { map.removeLayer(markers[k]); delete markers[k]; }
            delete markerHtmlCache[k];
            if (accuracyCircles[k]) { map.removeLayer(accuracyCircles[k]); delete accuracyCircles[k]; }
            if (unitSegments[k]) { unitSegments[k].forEach(seg => map.removeLayer(seg)); delete unitSegments[k]; }
            if (tethers[k]) { map.removeLayer(tethers[k]); delete tethers[k]; }
            if (relayCircles[k]) { map.removeLayer(relayCircles[k]); delete relayCircles[k]; }
            delete lastPositions[k];
            activeCasualties.delete(k);

            const card = document.getElementById(`unit_card_${k}`);
            if (card && card.parentNode) card.parentNode.removeChild(card);
        }

        function renderTelemetry() {
            if (!isListening) return;

            const data = knownUnits;
            const now = Date.now();
            const unitListEl = document.getElementById("unitList");

            // --- ADVANCED DEDUPLICATION & GHOST CLEANING ---
            const allKeys = Object.keys(data);
            const obsoleteKeysToDelete = new Set();

            for (let i = 0; i < allKeys.length; i++) {
                const keyA = allKeys[i];
                if (obsoleteKeysToDelete.has(keyA)) continue;
                const unitA = data[keyA];
                if (!unitA) continue;

                const ageA = now - (unitA.lastUpdated || 0);

                if ((!unitA.casualty || ageA > 300000) && ageA > GHOST_PURGE_MS) {
                    obsoleteKeysToDelete.add(keyA);
                    database.ref("commandos/" + keyA).remove().catch(() => {});
                    continue;
                }

                for (let j = i + 1; j < allKeys.length; j++) {
                    const keyB = allKeys[j];
                    if (obsoleteKeysToDelete.has(keyB)) continue;
                    const unitB = data[keyB];
                    if (!unitB) continue;

                    const idA = unitA.callsign || keyA;
                    const idB = unitB.callsign || keyB;

                    if (areDuplicateCallsigns(idA, idB)) {
                        const timeA = unitA.lastUpdated || 0;
                        const timeB = unitB.lastUpdated || 0;

                        let winnerKey, loserKey;
                        const isCdoA = String(idA).toUpperCase().includes("CDO");
                        const isCdoB = String(idB).toUpperCase().includes("CDO");

                        if (isCdoA !== isCdoB) {
                            winnerKey = isCdoA ? keyA : keyB;
                            loserKey = isCdoA ? keyB : keyA;
                        } else {
                            winnerKey = timeA >= timeB ? keyA : keyB;
                            loserKey = timeA >= timeB ? keyB : keyA;
                        }

                        const winnerUnit = data[winnerKey];
                        const loserUnit = data[loserKey];
                        if (loserUnit && (loserUnit.lastUpdated || 0) > (winnerUnit.lastUpdated || 0)) {
                            winnerUnit.lat = loserUnit.lat;
                            winnerUnit.lng = loserUnit.lng;
                            winnerUnit.accuracy = loserUnit.accuracy;
                            winnerUnit.rssi = loserUnit.rssi;
                            winnerUnit.relay_by = loserUnit.relay_by || loserUnit.relayBy;
                            winnerUnit.status = loserUnit.status;
                            winnerUnit.lastUpdated = loserUnit.lastUpdated;
                        }

                        obsoleteKeysToDelete.add(loserKey);
                        database.ref("commandos/" + loserKey).remove().catch(() => {});
                    }
                }
            }

            obsoleteKeysToDelete.forEach(k => {
                delete data[k];
                removeUnitFromMap(k);
            });

            Object.keys(data).forEach((key) => {
                const unit = data[key];
                if (unit && (STOP_STATUSES.includes(unit.status) || unit.sessionEnded === true)) {
                    delete knownUnits[key];
                    removeUnitFromMap(key);
                    database.ref("commandos/" + key).remove().catch(() => {});
                }
            });

            // --- BUCKETING FOR SQUAD HIT MERGE ---
            const mergedHitBuckets = {};
            mergedHits.forEach(hitKey => {
                mergedHitBuckets[hitKey] = [];
            });

            const standaloneKeys = [];

            Object.keys(data).forEach(key => {
                const unit = data[key];
                const meta = parseGroupAndHit(unit, key);
                const hitKey = `${meta.group}|${meta.hit}`;

                if (mergedHits.has(hitKey)) {
                    mergedHitBuckets[hitKey].push({ key, unit, meta });
                    // Remove individual commando marker from map while hit is merged
                    if (markers[key]) { map.removeLayer(markers[key]); delete markers[key]; }
                    delete markerHtmlCache[key];
                    if (accuracyCircles[key]) { map.removeLayer(accuracyCircles[key]); delete accuracyCircles[key]; }
                    if (tethers[key]) { map.removeLayer(tethers[key]); delete tethers[key]; }
                    // Remove individual card from sidebar if present
                    const indivCard = document.getElementById(`unit_card_${key}`);
                    if (indivCard && indivCard.parentNode) indivCard.parentNode.removeChild(indivCard);
                } else {
                    standaloneKeys.push(key);
                }
            });

            // Sort standalone commandos
            standaloneKeys.sort((a, b) => {
                const uA = data[a];
                const uB = data[b];
                const ageA = now - (uA.lastUpdated || 0);
                const ageB = now - (uB.lastUpdated || 0);
                const isRelA = (uA.status === "RELAYED_INDOOR" || !!uA.relay_by || !!uA.relayBy);
                const isRelB = (uB.status === "RELAYED_INDOOR" || !!uB.relay_by || !!uB.relayBy);
                const isLiveA = ((uA.status === "ONLINE" || isRelA) && ageA <= STALE_MS);
                const isLiveB = ((uB.status === "ONLINE" || isRelB) && ageB <= STALE_MS);
                const isCasA = !!uA.casualty;
                const isCasB = !!uB.casualty;

                const getRank = (isCas, isRel, isLive, u) => {
                    if (isCas) return 0;
                    if (isRel && isLive) return 1;
                    if (isLive) return 2;
                    if (u.status === "ONLINE" || u.status === "STALE" || isRel) return 3;
                    return 4;
                };

                const rankA = getRank(isCasA, isRelA, isLiveA, uA);
                const rankB = getRank(isCasB, isRelB, isLiveB, uB);

                if (rankA !== rankB) return rankA - rankB;
                return String(uA.callsign || a).localeCompare(String(uB.callsign || b));
            });

            let onlineCount = 0;
            let relayCount = 0;
            let casualtyCount = 0;
            let staleCount = 0;
            let visibleEntitiesCount = 0;

            // --- RENDER MERGED HIT SQUAD ENTITIES ---
            mergedHits.forEach(hitKey => {
                const members = mergedHitBuckets[hitKey] || [];
                const parts = hitKey.split("|");
                const grpName = parts[0];
                const hitName = parts[1];
                const domSafeHitId = hitKey.replace(/[^a-zA-Z0-9]/g, '_');

                let sumLat = 0, sumLng = 0, validLocCount = 0;
                let maxAcc = 0;
                let squadCasualty = false;
                let squadRelay = false;
                let squadOnline = false;
                let squadStale = false;
                let newestTimestamp = 0;

                members.forEach(item => {
                    const u = item.unit;
                    const ageMs = now - (u.lastUpdated || 0);
                    const isFresh = ageMs <= STALE_MS;
                    const isRel = (u.status === "RELAYED_INDOOR" || !!u.relay_by || !!u.relayBy);
                    const isLiveGps = (u.status === "ONLINE" && !isRel && isFresh);
                    const isLiveRel = (isRel && isFresh && u.status !== "OFFLINE");
                    const isLost = (u.status !== "OFFLINE" && ((!isFresh && (u.status === "ONLINE" || isRel)) || u.status === "STALE"));

                    if (u.casualty) squadCasualty = true;
                    if (isLiveRel) squadRelay = true;
                    if (isLiveGps) squadOnline = true;
                    if (isLost) squadStale = true;

                    if ((u.lastUpdated || 0) > newestTimestamp) newestTimestamp = u.lastUpdated;

                    if (typeof u.lat === 'number' && typeof u.lng === 'number' && u.lat !== 0 && u.lng !== 0) {
                        sumLat += u.lat;
                        sumLng += u.lng;
                        validLocCount++;
                        if ((u.accuracy || 0) > maxAcc) maxAcc = u.accuracy;
                    }
                });

                if (squadCasualty) casualtyCount++;
                else if (squadRelay) relayCount++;
                else if (squadOnline) onlineCount++;
                else if (squadStale) staleCount++;

                const squadOffline = !squadOnline && !squadRelay && !squadStale;

                if (hideOffline && squadOffline && !squadCasualty) {
                    if (mergedMarkers[hitKey]) { map.removeLayer(mergedMarkers[hitKey]); delete mergedMarkers[hitKey]; }
                    if (mergedCircles[hitKey]) { map.removeLayer(mergedCircles[hitKey]); delete mergedCircles[hitKey]; }
                    const card = document.getElementById(`merged_card_${domSafeHitId}`);
                    if (card && card.parentNode) card.parentNode.removeChild(card);
                    return;
                }

                visibleEntitiesCount++;

                // 1. Calculate Average GPS Location
                let avgLatLng = null;
                let squadRadius = 15;

                if (validLocCount > 0) {
                    const avgLat = sumLat / validLocCount;
                    const avgLng = sumLng / validLocCount;
                    avgLatLng = [avgLat, avgLng];

                    let maxDispersion = 0;
                    members.forEach(item => {
                        const u = item.unit;
                        if (typeof u.lat === 'number' && typeof u.lng === 'number') {
                            const d = map.distance(avgLatLng, [u.lat, u.lng]);
                            if (d > maxDispersion) maxDispersion = d;
                        }
                    });
                    squadRadius = Math.max(10, Math.min(maxDispersion + (maxAcc || 5), 75));

                    // Merged Map Marker Styling
                    let markerClass = "marker-online";
                    let statusLabel = `ONLINE · ${validLocCount}/6 GPS`;

                    if (squadCasualty) {
                        markerClass = "marker-casualty";
                        statusLabel = "🚨 CASUALTY IN SQUAD";
                        latestCasualtyLatLng = avgLatLng;
                        if (!isSirenMuted && !isInitialLoginLoad) playDistressSiren();
                    } else if (squadRelay) {
                        markerClass = "marker-relay";
                        statusLabel = `BLE RELAY · ${validLocCount}/6 GPS`;
                    } else if (squadStale) {
                        markerClass = "marker-stale";
                        statusLabel = `GPS LOST · ${validLocCount}/6 GPS`;
                    } else if (squadOffline) {
                        markerClass = "marker-offline";
                        statusLabel = "SQUAD OFFLINE";
                    }

                    const squadShort = `${grpName.substring(0,1)}-${hitName.replace(/\s+/g,'').toUpperCase()}`;
                    const markerHtml = `
                        <div class="merged-squad-marker ${markerClass}">
                            <div style="font-size:8px; font-weight:bold; letter-spacing:0.5px;">⚡ ${squadShort}</div>
                            <div style="font-size:10px; font-weight:900;">${validLocCount}/6 CDOS</div>
                        </div>
                    `;

                    // Generate Member Detail List for Popup
                    let memberListHtml = members.map(m => {
                        const callsign = sanitizeHtml(m.unit.callsign || m.key);
                        const cdoStatus = m.unit.casualty ? '<span style="color:#ef4444; font-weight:bold;">🚨 CASUALTY</span>' 
                            : (m.unit.status === 'RELAYED_INDOOR' ? '<span style="color:#f59e0b;">📡 RELAY</span>' 
                            : (m.unit.status === 'ONLINE' ? '<span style="color:#22c55e;">● ONLINE</span>' : 'OFFLINE'));
                        const acc = m.unit.accuracy ? `±${m.unit.accuracy.toFixed(1)}m` : 'N/A';
                        return `• ${callsign}: ${cdoStatus} (${acc})`;
                    }).join("<br>");

                    if (!memberListHtml) memberListHtml = "No commando telemetry reported yet.";

                    const popupHtml = `
                        <strong>⚡ ${sanitizeHtml(grpName)} - ${sanitizeHtml(hitName)}</strong><br>
                        <em>[SQUAD MERGED: AVERAGE GPS]</em><br>
                        <strong>Avg Lat:</strong> ${avgLat.toFixed(6)}<br>
                        <strong>Avg Lng:</strong> ${avgLng.toFixed(6)}<br>
                        <strong>Squad Spread:</strong> ±${squadRadius.toFixed(0)}m<br>
                        <strong>Status:</strong> ${statusLabel}<br>
                        <hr style="border-color:#334155; margin:5px 0;">
                        <strong>Team Roster (${members.length}/6):</strong><br>
                        <div style="font-size:11px; margin-top:3px; max-height:100px; overflow-y:auto;">
                            ${memberListHtml}
                        </div>
                        <button onclick="unmergeHit('${hitKey}')" style="width:100%; margin-top:8px; padding:5px; background:#d97706; color:#fff; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">
                            🔓 UNMERGE HIT (SHOW INDIVIDUAL LOCATIONS)
                        </button>
                    `;

                    if (!mergedMarkers[hitKey]) {
                        mergedMarkers[hitKey] = L.marker(avgLatLng, {
                            icon: L.divIcon({ html: markerHtml, className: '', iconSize: [58, 32] })
                        }).addTo(map);
                        mergedMarkers[hitKey].bindPopup(popupHtml);
                        mergedMarkerHtmlCache[hitKey] = markerHtml;
                    } else {
                        mergedMarkers[hitKey].setLatLng(avgLatLng);
                        if (mergedMarkerHtmlCache[hitKey] !== markerHtml) {
                            mergedMarkers[hitKey].setIcon(L.divIcon({ html: markerHtml, className: '', iconSize: [58, 32] }));
                            mergedMarkerHtmlCache[hitKey] = markerHtml;
                        }
                        mergedMarkers[hitKey].getPopup().setContent(popupHtml);
                    }

                    // Spread Footprint Circle
                    const circleColor = squadCasualty ? '#dc2626' : (squadRelay ? '#f59e0b' : '#38bdf8');
                    if (!mergedCircles[hitKey]) {
                        mergedCircles[hitKey] = L.circle(avgLatLng, {
                            radius: squadRadius,
                            color: circleColor,
                            weight: 2,
                            dashArray: '6, 6',
                            fillOpacity: 0.12,
                            fillColor: circleColor
                        }).addTo(map);
                    } else {
                        mergedCircles[hitKey].setLatLng(avgLatLng);
                        mergedCircles[hitKey].setRadius(squadRadius);
                        mergedCircles[hitKey].setStyle({ color: circleColor, fillColor: circleColor });
                    }
                } else {
                    if (mergedMarkers[hitKey]) { map.removeLayer(mergedMarkers[hitKey]); delete mergedMarkers[hitKey]; }
                    if (mergedCircles[hitKey]) { map.removeLayer(mergedCircles[hitKey]); delete mergedCircles[hitKey]; }
                }

                // 2. Render Merged Card in Sidebar Roster
                let mergedCard = document.getElementById(`merged_card_${domSafeHitId}`);
                if (!mergedCard) {
                    mergedCard = document.createElement("div");
                    mergedCard.id = `merged_card_${domSafeHitId}`;
                    mergedCard.setAttribute("data-merged-hit", hitKey);
                    unitListEl.appendChild(mergedCard);
                }
                unitListEl.appendChild(mergedCard);

                let cardClass = squadCasualty ? "card-merged-squad casualty" : "card-merged-squad";
                let statusBadgeText = squadCasualty ? "🚨 CASUALTY IN HIT" : (squadRelay ? "📡 RELAY SQUAD" : (squadOnline ? "● SQUAD ONLINE" : "SQUAD OFFLINE"));
                let statusBadgeColor = squadCasualty ? "var(--color-distress)" : (squadRelay ? "var(--color-relay)" : (squadOnline ? "var(--color-online)" : "#64748b"));

                mergedCard.className = `unit-card ${cardClass}`;
                mergedCard.onclick = () => focusMergedSquad(hitKey);

                // Members status chips
                const memberChipsHtml = members.map(m => {
                    const shortCdo = String(m.unit.callsign || m.key).replace(/.*CDO-?(\d+).*/i, 'C$1');
                    const chipColor = m.unit.casualty ? '#dc2626' : (m.unit.status === 'RELAYED_INDOOR' ? '#f59e0b' : (m.unit.status === 'ONLINE' ? '#16a34a' : '#475569'));
                    return `<span style="background:${chipColor}; color:#fff; font-size:9px; font-weight:bold; padding:2px 5px; border-radius:3px;">${shortCdo}</span>`;
                }).join(" ");

                mergedCard.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong style="color:#38bdf8; font-size:0.95rem;">⚡ ${sanitizeHtml(grpName)} - ${sanitizeHtml(hitName)}</strong>
                        <span style="font-size:0.75rem; font-weight:900; color:${statusBadgeColor}">
                            ${statusBadgeText}
                        </span>
                    </div>
                    <div style="font-size:0.7rem; color:var(--text-muted); margin-top:4px;">
                        [MERGED HIT] AVG GPS: ${avgLatLng ? `${avgLatLng[0].toFixed(5)},${avgLatLng[1].toFixed(5)}` : 'NO GPS'} | SPREAD: ±${squadRadius.toFixed(0)}m
                    </div>
                    <div style="display:flex; gap:4px; margin-top:6px; flex-wrap:wrap; align-items:center;">
                        <span style="font-size:0.68rem; color:var(--text-muted);">COMMANDOS (${members.length}/6):</span>
                        ${memberChipsHtml || '<span style="font-size:0.68rem; color:#64748b;">Waiting for units...</span>'}
                    </div>
                    <div style="display:flex; gap:6px; margin-top:8px;">
                        <button onclick="event.stopPropagation(); unmergeHit('${hitKey}')" 
                                style="flex:1; padding:6px; font-size:0.72rem; font-weight:bold; background:#d97706; color:#fff; border:none; border-radius:4px; cursor:pointer;">
                            🔓 UNMERGE (SHOW ALL 6 SEPARATELY)
                        </button>
                    </div>
                `;
            });

            // Clean up unmerged cards from sidebar
            Array.from(unitListEl.children).forEach(child => {
                const mergedAttr = child.getAttribute("data-merged-hit");
                if (mergedAttr && !mergedHits.has(mergedAttr)) {
                    unitListEl.removeChild(child);
                }
            });

            // --- RENDER STANDALONE COMMANDOS ---
            standaloneKeys.forEach((key) => {
                const unit = data[key];
                const isCasualty = !!unit.casualty;
                const isRelayed = (unit.status === "RELAYED_INDOOR" || !!unit.relay_by || !!unit.relayBy);
                const ageMs = now - (unit.lastUpdated || 0);
                const isFresh = ageMs <= STALE_MS;

                const isExplicitOffline = (unit.status === "OFFLINE");
                const isLiveGps = (unit.status === "ONLINE" && !isRelayed && isFresh);
                const isLiveRelay = (isRelayed && isFresh && !isExplicitOffline);
                const isGpsLost = (!isExplicitOffline && ((!isFresh && (unit.status === "ONLINE" || isRelayed)) || unit.status === "STALE"));
                const isOffline = isExplicitOffline || (!isLiveGps && !isLiveRelay && !isGpsLost);

                if (isLiveGps) onlineCount++;
                else if (isLiveRelay) relayCount++;
                else if (isGpsLost) staleCount++;

                if (isCasualty) {
                    casualtyCount++;
                    if (unit.lat && unit.lng) latestCasualtyLatLng = [unit.lat, unit.lng];

                    if (!activeCasualties.has(key)) {
                        activeCasualties.add(key);
                        if (!isInitialLoginLoad && !isSirenMuted) {
                            playDistressSiren();
                        }
                    }
                } else {
                    activeCasualties.delete(key);
                }

                if (hideOffline && isOffline && !isCasualty) {
                    removeUnitFromMap(key);
                    return;
                }

                visibleEntitiesCount++;

                if (unitSegments[key]) {
                    unitSegments[key].forEach(seg => {
                        if (!map.hasLayer(seg)) seg.addTo(map);
                    });
                }

                const ageSec = Math.max(0, Math.round(ageMs / 1000));
                const ageText = ageSec < 60 ? `${ageSec}s` : `${Math.floor(ageSec / 60)}m`;

                // Individual Map Marker
                if (unit.lat && unit.lng) {
                    const latLng = [unit.lat, unit.lng];
                    
                    let accRadius = Math.min(Math.max(unit.accuracy || 5, 2), 35);
                    if (isRelayed && unit.rssi) {
                        const estMeters = Math.pow(10, (-59 - unit.rssi) / 26);
                        accRadius = Math.min(Math.max(estMeters, 4), 32);
                    }

                    let markerClass = "marker-online";
                    let markerBg = "var(--color-online)";
                    let statusLabelText = "ONLINE";

                    const relaySource = unit.relay_by || unit.relayBy || "";

                    if (isCasualty) {
                        markerClass = "marker-casualty";
                        markerBg = "var(--color-distress)";
                        statusLabelText = "DISTRESS / CASUALTY";
                    } else if (isLiveRelay) {
                        markerClass = "marker-relay";
                        markerBg = "var(--color-relay)";
                        statusLabelText = `BLE RELAY (via ${relaySource || 'SCOUT'})`;
                    } else if (isGpsLost) {
                        markerClass = "marker-stale";
                        markerBg = "var(--color-gps-lost)";
                        statusLabelText = `GPS LOST (${ageText})`;
                    } else if (isOffline) {
                        markerClass = "marker-offline";
                        markerBg = "var(--color-offline)";
                        statusLabelText = "OFFLINE";
                    }

                    const safeCallsign = sanitizeHtml(unit.callsign || key);
                    const safeStatus = sanitizeHtml(statusLabelText);
                    const initials = safeCallsign.substring(0, 2).toUpperCase();
                    
                    const markerHtml = `<div class="commando-marker ${markerClass}" style="background:${markerBg};">${initials}</div>`;
                    
                    const rssiInfo = (isRelayed && unit.rssi !== undefined) ? `<br>BLE Signal: ${unit.rssi} dBm (~${accRadius.toFixed(1)}m)` : '';
                    const anchorInfo = (isRelayed && relaySource) ? `<br>Anchored to: ${sanitizeHtml(relaySource)}` : '';
                    const popupHtml = `<strong>${safeCallsign}</strong><br>Status: ${safeStatus}<br>Acc: ±${accRadius.toFixed(1)}m${anchorInfo}${rssiInfo}`;

                    if (!markers[key]) {
                        markers[key] = L.marker(latLng, { 
                            icon: L.divIcon({ html: markerHtml, className: '', iconSize: [28, 28] }) 
                        }).addTo(map);
                        markers[key].bindPopup(popupHtml);
                        markerHtmlCache[key] = markerHtml;
                    } else {
                        markers[key].setLatLng(latLng);
                        if (markerHtmlCache[key] !== markerHtml) {
                            markers[key].setIcon(L.divIcon({ html: markerHtml, className: '', iconSize: [28, 28] }));
                            markerHtmlCache[key] = markerHtml;
                        }
                        markers[key].getPopup().setContent(popupHtml);
                    }

                    // Accuracy Circle
                    if (isLiveGps || isLiveRelay) {
                        const circleColor = isCasualty ? '#dc2626' : (isLiveRelay ? '#f59e0b' : '#15803d');
                        const circleOpacity = isLiveRelay ? 0.18 : 0.12;

                        if (!accuracyCircles[key]) {
                            accuracyCircles[key] = L.circle(latLng, {
                                radius: accRadius,
                                color: circleColor,
                                weight: isLiveRelay ? 1.5 : 1,
                                fillOpacity: circleOpacity,
                                fillColor: circleColor,
                                dashArray: isLiveRelay ? '4, 4' : null
                            }).addTo(map);
                        } else {
                            accuracyCircles[key].setLatLng(latLng);
                            accuracyCircles[key].setRadius(accRadius);
                            accuracyCircles[key].setStyle({
                                color: circleColor,
                                fillColor: circleColor,
                                fillOpacity: circleOpacity,
                                dashArray: isLiveRelay ? '4, 4' : null
                            });
                        }
                    } else {
                        if (accuracyCircles[key]) {
                            map.removeLayer(accuracyCircles[key]);
                            delete accuracyCircles[key];
                        }
                    }

                    // BLE Dynamic Tether Line
                    if (isLiveRelay && relaySource && (data[relaySource] || lastPositions[relaySource])) {
                        const parentUnit = data[relaySource];
                        const parentLatLng = (parentUnit && parentUnit.lat && parentUnit.lng) 
                            ? [parentUnit.lat, parentUnit.lng] 
                            : lastPositions[relaySource];

                        if (parentLatLng) {
                            if (!tethers[key]) {
                                tethers[key] = L.polyline([parentLatLng, latLng], {
                                    color: '#f59e0b',
                                    weight: 2.5,
                                    dashArray: '6, 8',
                                    opacity: 0.85
                                }).addTo(map);
                            } else {
                                tethers[key].setLatLngs([parentLatLng, latLng]);
                                if (!map.hasLayer(tethers[key])) tethers[key].addTo(map);
                            }
                        }
                    } else {
                        if (tethers[key]) {
                            map.removeLayer(tethers[key]);
                            delete tethers[key];
                        }
                    }

                    // Traveled path segments
                    if (!unitSegments[key]) unitSegments[key] = [];

                    if (lastPositions[key]) {
                        if (isLiveGps || isCasualty) {
                            const prevLatLng = lastPositions[key];
                            const distanceMoved = map.distance(prevLatLng, latLng);
                            const minMoveThreshold = Math.max(2.5, accRadius * 0.4);

                            if (distanceMoved >= minMoveThreshold) {
                                const pathColor = isCasualty ? '#ef4444' : '#38bdf8';
                                const segment = L.polyline([prevLatLng, latLng], {
                                    color: pathColor,
                                    weight: 3,
                                    opacity: 0.35
                                }).addTo(map);

                                unitSegments[key].push(segment);
                                if (unitSegments[key].length > 60) {
                                    const oldest = unitSegments[key].shift();
                                    map.removeLayer(oldest);
                                }
                                lastPositions[key] = latLng;
                            }
                        }
                    } else {
                        lastPositions[key] = latLng;
                    }
                }

                // In-place individual roster update
                let card = document.getElementById(`unit_card_${key}`);
                if (!card) {
                    card = document.createElement("div");
                    card.id = `unit_card_${key}`;
                    card.setAttribute("data-key", key);
                    unitListEl.appendChild(card);
                }

                unitListEl.appendChild(card);

                let cardClass = "card-online";
                let statusBadgeText = "● ONLINE";
                let statusBadgeColor = "var(--color-online)";

                if (isCasualty) {
                    cardClass = "card-casualty";
                    statusBadgeText = "🚨 CASUALTY";
                    statusBadgeColor = "var(--color-distress)";
                } else if (isLiveRelay) {
                    cardClass = "card-relay";
                    statusBadgeText = "📡 BLE RELAY";
                    statusBadgeColor = "var(--color-relay)";
                } else if (isGpsLost) {
                    cardClass = "card-stale";
                    statusBadgeText = `⚠ GPS LOST · ${ageText}`;
                    statusBadgeColor = "#ca8a04";
                } else if (isOffline) {
                    cardClass = "card-offline";
                    statusBadgeText = "OFFLINE";
                    statusBadgeColor = "#64748b";
                }

                card.className = `unit-card ${cardClass}`;
                card.onclick = () => focusCommando(key);

                const headingDeg = Math.round(unit.heading || 0);
                const safeName = sanitizeHtml(unit.callsign || key);
                const safeGroup = sanitizeHtml(unit.group || 'N/A');
                const relayDetails = isLiveRelay 
                    ? `<div style="font-size:0.68rem; color:#fde68a; margin-top:2px;">↳ RELAY VIA: ${sanitizeHtml(unit.relay_by || unit.relayBy || 'SCOUT')} | RSSI: ${unit.rssi ? unit.rssi + ' dBm' : 'N/A'}</div>` 
                    : '';

                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong style="color:#fff;">${safeName}</strong>
                        <span style="font-size:0.75rem; font-weight:bold; color:${statusBadgeColor}">
                            ${statusBadgeText}
                        </span>
                    </div>
                    <div style="font-size:0.7rem; color:var(--text-muted); margin-top:4px;">
                        ACC: ±${unit.accuracy ? unit.accuracy.toFixed(1) : 0}m | HDG: ${headingDeg}° | GRP: ${safeGroup}
                    </div>
                    ${relayDetails}
                    ${unit.audioActive ? `
                        <button id="audioBtn_${key}" class="btn-listen ${currentListeningUnit === key ? 'monitoring' : ''}" 
                                onclick="event.stopPropagation(); toggleAudioListen('${key}')">
                            ${currentListeningUnit === key ? '🔊 SPEAKER: ON (MUTE)' : '🎙️ TURN SPEAKER ON (LISTEN)'}
                        </button>
                    ` : ''}
                `;
            });

            // Clean up standalone cards
            Array.from(unitListEl.children).forEach(child => {
                const cardKey = child.getAttribute("data-key");
                if (cardKey && (!data[cardKey] || mergedHits.has(`${parseGroupAndHit(data[cardKey], cardKey).group}|${parseGroupAndHit(data[cardKey], cardKey).hit}`))) {
                    unitListEl.removeChild(child);
                }
            });

            document.getElementById("onlineCount").innerText = onlineCount;
            document.getElementById("relayCount").innerText = relayCount;
            document.getElementById("casualtyCount").innerText = casualtyCount;
            document.getElementById("staleCount").innerText = staleCount;
            document.getElementById("totalUnitsBadge").innerText = `${visibleEntitiesCount} OPERATIONAL`;
            document.getElementById("casualtyNoticeBar").style.display = casualtyCount > 0 ? "flex" : "none";
        }

        // --- 9. MANUAL PURGE DATABASE GHOSTS ---
        async function purgeDatabaseGhosts() {
            const choice = confirm("PURGE GHOST ENTRIES?\n\nClick [OK] to clean stale / duplicate entries.\nActive commandos and fresh casualties will not be affected.");
            if (!choice) return;

            const now = Date.now();
            let purgedCount = 0;

            try {
                const snap = await database.ref("commandos").get();
                const allData = snap.val() || {};

                for (const key of Object.keys(allData)) {
                    const u = allData[key];
                    const ageMs = now - (u.lastUpdated || 0);

                    const isStaleCasualty = (u.casualty && ageMs > 180000);
                    if ((!u.casualty || isStaleCasualty) && (ageMs > 45000 || STOP_STATUSES.includes(u.status) || u.status === "OFFLINE")) {
                        await database.ref("commandos/" + key).remove();
                        delete knownUnits[key];
                        removeUnitFromMap(key);
                        purgedCount++;
                    }
                }

                alert("DATABASE PURGE COMPLETE\nRemoved " + purgedCount + " stale or duplicate entries from Firebase.");
                renderTelemetry();
            } catch (err) {
                alert("Purge failed: " + err.message);
            }
        }

        // --- 10. TACTICAL FOCUS CONTROLS ---
        function focusCommando(unitKey) {
            const unit = knownUnits[unitKey];
            if (!unit || typeof unit.lat !== 'number' || typeof unit.lng !== 'number') {
                return;
            }

            const targetPos = [unit.lat, unit.lng];
            const targetZoom = 18;

            map.flyTo(targetPos, targetZoom, {
                animate: true,
                duration: 1.2,
                easeLinearity: 0.25
            });

            if (markers[unitKey]) {
                markers[unitKey].openPopup();
                
                const markerEl = markers[unitKey].getElement();
                if (markerEl) {
                    const innerMarker = markerEl.querySelector('.commando-marker');
                    if (innerMarker) {
                        innerMarker.classList.remove('marker-focused');
                        void innerMarker.offsetWidth;
                        innerMarker.classList.add('marker-focused');
                    }
                }
            }

            if (window.innerWidth <= 768) {
                const sidebar = document.getElementById("sidebarPanel");
                const btn = document.getElementById("toggleRosterBtn");
                if (sidebar && sidebar.style.display !== "none")
