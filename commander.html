<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TACTICAL BFT DASHBOARD // COMMAND</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #06090e;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Roboto", monospace;
      color: #e2e8f0;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Top HUD Status Bar */
    .top-hud {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      background: rgba(10, 15, 24, 0.92);
      border: 1px solid rgba(0, 229, 255, 0.35);
      border-radius: 4px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
    }

    .hud-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #00e5ff;
      text-transform: uppercase;
    }

    .hud-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-family: monospace;
      color: #10b981;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: blink 2s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Tactical Floating Control & Route Panel */
    .tactical-control-panel {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      width: 320px;
      background: rgba(10, 15, 24, 0.94);
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 6px;
      padding: 14px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      font-family: monospace;
    }

    .panel-section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #38bdf8;
      text-transform: uppercase;
      margin-bottom: 10px;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      display: flex;
      justify-content: space-between;
    }

    /* Buttons */
    .btn {
      width: 100%;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #475569;
      padding: 8px 12px;
      font-size: 12px;
      font-family: inherit;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      margin-bottom: 8px;
    }

    .btn:hover {
      background: #334155;
      border-color: #00e5ff;
      color: #fff;
    }

    .btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
      color: #fca5a5;
    }
    .btn-danger:hover {
      background: #ef4444;
      color: #fff;
    }

    /* Mode Selection Tabs (Vehicle / Walk) */
    .mode-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }

    .mode-btn {
      background: #111c2e;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 8px;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: rgba(0, 229, 255, 0.2);
      border-color: #00e5ff;
      color: #00e5ff;
      font-weight: bold;
    }

    /* Route Statistics Card */
    .route-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 4px;
      padding: 10px;
      margin-top: 8px;
      font-size: 12px;
    }

    .route-stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .route-stat-row:last-child {
      margin-bottom: 0;
    }

    .route-val {
      font-weight: bold;
      color: #00e5ff;
    }

    /* Commando Roster Quick Drawer */
    .roster-list {
      max-height: 140px;
      overflow-y: auto;
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .roster-item {
      padding: 6px 8px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 3px;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .roster-item:hover, .roster-item.active {
      border-color: #00e5ff;
      background: #1e293b;
    }

    /* Map Markers */
    .commander-hq-icon {
      position: relative;
    }
    .hq-core {
      width: 14px;
      height: 14px;
      background: #00e5ff;
      border: 2px solid #ffffff;
      border-radius: 50%;
      position: absolute;
      top: 5px;
      left: 5px;
      box-shadow: 0 0 10px #00e5ff;
    }
    .hq-pulse-ring {
      width: 24px;
      height: 24px;
      background: rgba(0, 229, 255, 0.4);
      border-radius: 50%;
      animation: pulse-ring 1.8s infinite;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    .commando-marker {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid #10b981;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #10b981;
      font-size: 10px;
      font-weight: bold;
      font-family: monospace;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }

    /* Custom Leaflet Control Layer Styling */
    .leaflet-control-layers {
      background: rgba(15, 23, 42, 0.9) !important;
      border: 1px solid rgba(0, 229, 255, 0.3) !important;
      color: #e2e8f0 !important;
      border-radius: 4px !important;
      font-family: monospace !important;
    }
    .leaflet-control-layers-expanded {
      padding: 8px 12px !important;
    }
  </style>
</head>
<body>

  <!-- Top Status Bar -->
  <div class="top-hud">
    <div class="hud-title">Force One // Tactical Grid</div>
    <div class="hud-status-badge">
      <span class="status-dot"></span> LIVE LINK
    </div>
  </div>

  <!-- Interactive Controls & Path Tracking Panel -->
  <div class="tactical-control-panel">
    
    <!-- GPS Section -->
    <div class="panel-section-title">COMMAND LOCATION</div>
    <button id="btn-my-location" class="btn" onclick="toggleMyLocation()">
      📍 Acquire HQ Position
    </button>

    <!-- Navigation Mode -->
    <div class="panel-section-title" style="margin-top: 12px;">NAV ROUTING MODE</div>
    <div class="mode-group">
      <button id="mode-driving" class="mode-btn active" onclick="setRouteMode('driving')">
        🚗 Vehicle
      </button>
      <button id="mode-foot" class="mode-btn" onclick="setRouteMode('foot')">
        🚶 Foot / Patrol
      </button>
    </div>

    <!-- Live Units Roster -->
    <div class="panel-section-title">SQUAD UNITS (CLICK TO INTERCEPT)</div>
    <div class="roster-list" id="roster-container">
      <!-- Generated via JS -->
    </div>

    <!-- Active Route Details -->
    <div id="route-panel" style="display: none; margin-top: 12px;">
      <div class="panel-section-title">ROUTE TELEMETRY</div>
      <div class="route-card">
        <div class="route-stat-row">
          <span>Target Unit:</span>
          <span class="route-val" id="stat-callsign">--</span>
        </div>
        <div class="route-stat-row">
          <span>Distance:</span>
          <span class="route-val" id="stat-distance">--</span>
        </div>
        <div class="route-stat-row">
          <span>Est. Transit:</span>
          <span class="route-val" id="stat-eta">--</span>
        </div>
        <div class="route-stat-row">
          <span>Routing:</span>
          <span class="route-val" id="stat-mode">Vehicle</span>
        </div>
      </div>
      <button class="btn btn-danger" style="margin-top: 8px;" onclick="clearActiveRoute()">
        ✖ Abort Route
      </button>
    </div>

  </div>

  <!-- Map Container -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // --- 1. Map Initialization with Multiple Tactical Basemaps ---
    const darkMatter = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; CartoDB',
      maxZoom: 20
    });

    const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: '&copy; Esri World Imagery',
      maxZoom: 19
    });

    // Default center: Force One HQ / Mumbai Hub
    const defaultCoords = [19.1293, 72.8680];
    const map = L.map('map', {
      center: defaultCoords,
      zoom: 14,
      layers: [darkMatter],
      zoomControl: false
    });

    // Reposition zoom controls to bottom-left
    L.control.zoom({ position: 'bottomleft' }).addTo(map);

    // Layer switch control
    const baseLayers = {
      "Tactical Dark": darkMatter,
      "Satellite High-Res": esriSatellite
    };
    L.control.layers(baseLayers, null, { position: 'bottomright' }).addTo(map);

    // --- 2. State & Tracking Variables ---
    let commanderLocation = null;
    let commanderMarker = null;
    let activeRouteLayer = null;
    let selectedCommando = null;
    let currentTravelMode = 'driving'; // 'driving' or 'foot'
    let watchId = null;

    // --- 3. Sample Squad Data (Simulated Field Beacons) ---
    const commandos = [
      { id: "C-101", callsign: "Alpha-1 (Lead)", lat: 19.1345, lng: 72.8712, battery: "92%", status: "Active" },
      { id: "C-102", callsign: "Bravo-2 (Scout)", lat: 19.1221, lng: 72.8590, battery: "84%", status: "Patrol" },
      { id: "C-103", callsign: "Delta-4 (Support)", lat: 19.1410, lng: 72.8530, battery: "67%", status: "Overwatch" },
      { id: "C-104", callsign: "Echo-5 (Sniper)", lat: 19.1170, lng: 72.8760, battery: "95%", status: "Static" }
    ];

    const commandoMarkers = {};

    // --- 4. Render Commando Markers & Roster ---
    function renderCommandos() {
      const rosterContainer = document.getElementById('roster-container');
      rosterContainer.innerHTML = '';

      commandos.forEach(cmd => {
        // Map Icon
        const icon = L.divIcon({
          className: 'commando-marker-icon',
          html: `<div class="commando-marker" style="width:26px; height:26px;">${cmd.id.split('-')[1]}</div>`,
          iconSize: [26, 26],
          iconAnchor: [13, 13]
        });

        const marker = L.marker([cmd.lat, cmd.lng], { icon: icon }).addTo(map);
        marker.bindPopup(`
          <div style="font-family:monospace; font-size:12px; color:#0f172a;">
            <b>${cmd.callsign}</b><br/>
            ID: ${cmd.id}<br/>
            Status: ${cmd.status}<br/>
            Batt: ${cmd.battery}<br/>
            <button style="margin-top:6px; cursor:pointer;" onclick="selectCommandoForRoute('${cmd.id}')">
              Plot Intercept
            </button>
          </div>
        `);

        marker.on('click', () => selectCommandoForRoute(cmd.id));
        commandoMarkers[cmd.id] = marker;

        // Roster Item in Sidebar
        const item = document.createElement('div');
        item.className = 'roster-item';
        item.id = `roster-${cmd.id}`;
        item.innerHTML = `
          <span><b>${cmd.id}</b> ${cmd.callsign}</span>
          <span style="color:#10b981;">${cmd.status}</span>
        `;
        item.onclick = () => selectCommandoForRoute(cmd.id);
        rosterContainer.appendChild(item);
      });
    }

    // --- 5. Own Location Tracker (Commander Base) ---
    function toggleMyLocation() {
      const btn = document.getElementById('btn-my-location');

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        btn.classList.remove('active');
        btn.innerText = "📍 Acquire HQ Position";
      } else {
        if (!navigator.geolocation) {
          alert("GPS telemetry not supported on this browser/environment.");
          return;
        }

        btn.classList.add('active');
        btn.innerText = "🎯 Tracking Base...";

        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            commanderLocation = [pos.coords.latitude, pos.coords.longitude];

            if (!commanderMarker) {
              const hqIcon = L.divIcon({
                className: 'commander-hq-icon',
                html: '<div class="hq-pulse-ring"></div><div class="hq-core"></div>',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
              });

              commanderMarker = L.marker(commanderLocation, { icon: hqIcon })
                .addTo(map)
                .bindPopup("<b>Command Base (HQ)</b>");

              map.setView(commanderLocation, 14);
            } else {
              commanderMarker.setLatLng(commanderLocation);
            }

            // Recalculate if a unit is currently tracked
            if (selectedCommando) {
              calculateShortestPath();
            }
          },
          (err) => {
            console.error("GPS Error:", err);
            btn.classList.remove('active');
            btn.innerText = "📍 Acquire HQ Position";
            alert("Unable to acquire GPS signal. Check device permissions.");
          },
          { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
        );
      }
    }

    // --- 6. Mode Switcher (Vehicle vs Walk) ---
    function setRouteMode(mode) {
      currentTravelMode = mode;
      document.getElementById('mode-driving').classList.toggle('active', mode === 'driving');
      document.getElementById('mode-foot').classList.toggle('active', mode === 'foot');

      if (selectedCommando && commanderLocation) {
        calculateShortestPath();
      }
    }

    // --- 7. Commando Selection Handler ---
    function selectCommandoForRoute(commandoId) {
      const commando = commandos.find(c => c.id === commandoId);
      if (!commando) return;

      selectedCommando = commando;

      // Update UI active states
      document.querySelectorAll('.roster-item').forEach(el => el.classList.remove('active'));
      const activeItem = document.getElementById(`roster-${commando.id}`);
      if (activeItem) activeItem.classList.add('active');

      if (!commanderLocation) {
        alert(`Target ${commando.callsign} locked. Click "Acquire HQ Position" to generate the shortest path.`);
        map.panTo([commando.lat, commando.lng]);
        return;
      }

      calculateShortestPath();
    }

    // --- 8. OSRM Shortest Path Calculation Engine ---
    async function calculateShortestPath() {
      if (!commanderLocation || !selectedCommando) return;

      const [startLat, startLng] = commanderLocation;
      const { lat: endLat, lng: endLng, callsign } = selectedCommando;

      // Routing API profile: 'driving' or 'foot'
      const profile = currentTravelMode === 'foot' ? 'foot' : 'driving';
      const osrmUrl = `https://router.project-osrm.org/route/v1/${profile}/${startLng},${startLat};${endLng},${endLat}?overview=full&geometries=geojson`;

      try {
        const response = await fetch(osrmUrl);
        const data = await response.json();

        if (!data.routes || data.routes.length === 0) {
          alert("No viable pathway found for this mode.");
          return;
        }

        const route = data.routes[0];
        const coordinates = route.geometry.coordinates.map(coord => [coord[1], coord[0]]);

        // Remove old route polyline
        if (activeRouteLayer) {
          map.removeLayer(activeRouteLayer);
        }

        // Apply Tactical Styling based on Mode
        const routeStyle = currentTravelMode === 'driving'
          ? { color: '#00e5ff', weight: 5, opacity: 0.9, lineJoin: 'round' } // Vehicle: Solid Neon Cyan
          : { color: '#f59e0b', weight: 4, opacity: 0.95, dashArray: '6, 8' }; // Foot: Dashed Tactical Amber

        activeRouteLayer = L.polyline(coordinates, routeStyle).addTo(map);

        // Fit both HQ and target in view
        map.fitBounds(activeRouteLayer.getBounds(), { padding: [50, 50] });

        // Update HUD statistics
        const distanceKm = (route.distance / 1000).toFixed(2);
        const durationMin = Math.round(route.duration / 60);

        document.getElementById('stat-callsign').innerText = callsign;
        document.getElementById('stat-distance').innerText = `${distanceKm} km`;
        document.getElementById('stat-eta').innerText = `${durationMin} mins`;
        document.getElementById('stat-mode').innerText = currentTravelMode === 'driving' ? 'Vehicle' : 'Foot Patrol';
        document.getElementById('route-panel').style.display = 'block';

      } catch (err) {
        console.error("Path calculation error:", err);
      }
    }

    // --- 9. Clear Active Path ---
    function clearActiveRoute() {
      if (activeRouteLayer) {
        map.removeLayer(activeRouteLayer);
        activeRouteLayer = null;
      }
      selectedCommando = null;
      document.querySelectorAll('.roster-item').forEach(el => el.classList.remove('active'));
      document.getElementById('route-panel').style.display = 'none';
    }

    // Initialize Markers on load
    renderCommandos();
  </script>
</body>
</html>
