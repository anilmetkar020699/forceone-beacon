<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORCE ONE - HQ Tactical Command</title>
  
  <!-- Leaflet CSS for Tactical Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-dark: #080d14;
      --panel-bg: rgba(13, 21, 32, 0.94);
      --border-color: #1e3048;
      --accent-blue: #0099ff;
      --alert-red: #ff3344;
      --warning-amber: #ffaa00;
      --text-gold: #d4af37;
      --text-main: #e2eaf4;
      --text-muted: #758ca3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
    }

    /* ================= LOGIN OVERLAY ================= */
    #login-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #111d2e 0%, #05080d 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }

    .login-card {
      background: rgba(14, 22, 35, 0.97);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 8px;
      padding: 28px;
      width: 360px;
      text-align: center;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.95), 0 0 15px rgba(212, 175, 55, 0.2);
    }

    .f1-vector-emblem {
      width: 140px;
      height: 160px;
      margin: 0 auto 10px auto;
      display: block;
      filter: drop-shadow(0px 0px 10px rgba(212, 175, 55, 0.45));
    }

    .login-card h2 {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 2.5px;
      color: #ffffff;
    }

    .login-card .motto {
      font-size: 13px;
      color: var(--text-gold);
      margin: 4px 0 18px 0;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .login-input {
      width: 100%;
      padding: 11px 12px;
      margin-bottom: 12px;
      background: #090e17;
      border: 1px solid #1f324d;
      color: #fff;
      border-radius: 4px;
      font-size: 14px;
      outline: none;
    }

    .login-input:focus {
      border-color: var(--accent-blue);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: #a81c1c;
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 1.5px;
      transition: background 0.2s;
    }

    .login-btn:hover {
      background: #cc2222;
    }

    .login-error {
      color: #ff4d4d;
      font-size: 12px;
      margin-top: 10px;
      display: none;
      font-weight: 600;
    }

    /* ================= MAIN DASHBOARD LAYOUT ================= */
    #app-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }

    /* TOP BAR */
    .top-header {
      height: 48px;
      background: #0a111a;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 1000;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-btn {
      background: transparent;
      border: 1px solid #283e58;
      color: #c0d1e5;
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-btn:hover {
      background: #152438;
    }

    .btn-ied { color: var(--warning-amber); border-color: rgba(255,170,0,0.4); }
    .btn-breach { color: #2ecc71; border-color: rgba(46,204,113,0.4); }
    .btn-logout { background: #881a1a; color: #fff; border-color: #aa2222; }

    .siren-toggle {
      font-weight: 800;
      border-radius: 4px;
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid;
      transition: 0.2s;
    }

    .siren-on {
      background: rgba(39, 174, 96, 0.2);
      color: #2ecc71;
      border-color: #27ae60;
    }

    .siren-off {
      background: rgba(192, 57, 43, 0.2);
      color: #e74c3c;
      border-color: #c0392b;
    }

    /* WORKSPACE */
    .workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 48px);
      position: relative;
    }

    /* SIDEBAR */
    .sidebar {
      width: 320px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 999;
    }

    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header span {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #4da6ff;
    }

    .sidebar-header .count {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
    }

    .unit-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .unit-card {
      background: rgba(10, 16, 26, 0.8);
      border: 1px solid #1a293d;
      border-radius: 5px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border 0.15s;
    }

    .unit-card:hover {
      border-color: var(--accent-blue);
    }

    .unit-card.selected {
      border-color: var(--warning-amber);
    }

    .unit-card.distress-active {
      border-color: var(--alert-red);
      animation: pulseAlert 1s infinite alternate;
    }

    @keyframes pulseAlert {
      from { box-shadow: 0 0 4px rgba(255, 51, 68, 0.4); }
      to { box-shadow: 0 0 14px rgba(255, 51, 68, 0.9); }
    }

    .unit-card-title {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      color: #e6f0fa;
      margin-bottom: 4px;
    }

    .unit-status {
      font-size: 11px;
      font-weight: 800;
    }

    .status-online { color: #2ecc71; }
    .status-stale { color: var(--warning-amber); }
    .status-offline { color: #5a738e; }
    .status-distress { color: var(--alert-red); }

    .unit-meta {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* MAP CONTAINER */
    #map {
      flex: 1;
      height: 100%;
      background: #090e15;
    }

    .leaflet-tile-pane {
      filter: invert(100%) hue-rotate(180deg) brightness(88%) contrast(95%);
    }
  </style>
</head>
<body>

  <!-- ================= 1. LOGIN OVERLAY WITH EMBEDDED FORCE ONE EMBLEM ================= -->
  <div id="login-overlay">
    <div class="login-card">
      
      <!-- Embedded Force One Insignia Vector (No external image file needed) -->
      <svg class="f1-vector-emblem" viewBox="0 0 240 280">
        <defs>
          <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#1b2d5a"/>
            <stop offset="100%" stop-color="#080e22"/>
          </radialGradient>
          <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffe680"/>
            <stop offset="50%" stop-color="#d4af37"/>
            <stop offset="100%" stop-color="#997a15"/>
          </linearGradient>
          <linearGradient id="bladeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#fdfdfd"/>
            <stop offset="50%" stop-color="#d4af37"/>
            <stop offset="100%" stop-color="#997a15"/>
          </linearGradient>
          <linearGradient id="ribbonGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#b81b24"/>
            <stop offset="100%" stop-color="#730e14"/>
          </linearGradient>
        </defs>

        <!-- Outer Wreath / Flame Petals -->
        <path d="M120 10 C185 10 230 65 230 140 C230 205 185 245 120 255 C55 245 10 205 10 140 C10 65 55 10 120 10 Z" 
              fill="url(#goldGradient)" stroke="#80620c" stroke-width="2"/>
        
        <!-- Outer Golden Notch Cuts -->
        <path d="M10 140 L30 130 L20 110 L40 105 L30 85 L52 82 L45 60 L70 65 L68 45 L95 55 L100 35 L120 45 L140 35 L145 55 L172 45 L170 65 L195 60 L188 82 L210 85 L200 105 L220 110 L210 130 L230 140 L210 160 L220 180 L198 185 L205 205 L180 208 L182 225 L160 223 L155 240 L120 255 L85 240 L80 223 L58 225 L60 208 L35 205 L42 185 L20 180 L30 160 Z" 
              fill="url(#goldGradient)" opacity="0.95"/>

        <!-- Inner Navy Oval -->
        <ellipse cx="120" cy="138" rx="88" ry="102" fill="url(#bgGradient)" stroke="url(#goldGradient)" stroke-width="4"/>

        <!-- Top Police Star -->
        <polygon points="120,38 124,48 135,48 126,54 130,64 120,58 110,64 114,54 105,48 116,48" 
                 fill="#4da6ff" stroke="#ffe680" stroke-width="1.2"/>
        
        <!-- Maharashtra Police Subtitle -->
        <text x="120" y="75" fill="#f0e6c8" font-size="8.5" font-weight="bold" text-anchor="middle" letter-spacing="1">MAHARASHTRA POLICE</text>

        <!-- Sunburst Radiance Behind Knife -->
        <g stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.75">
          <line x1="120" y1="140" x2="60" y2="105"/>
          <line x1="120" y1="140" x2="70" y2="92"/>
          <line x1="120" y1="140" x2="85" y2="82"/>
          <line x1="120" y1="140" x2="102" y2="76"/>
          <line x1="120" y1="140" x2="138" y2="76"/>
          <line x1="120" y1="140" x2="155" y2="82"/>
          <line x1="120" y1="140" x2="170" y2="92"/>
          <line x1="120" y1="140" x2="180" y2="105"/>
        </g>

        <!-- Commando Combat Dagger -->
        <path d="M120 62 L128 105 L128 200 L112 200 L112 105 Z" fill="url(#bladeGradient)" stroke="#594305" stroke-width="1"/>
        <line x1="120" y1="62" x2="120" y2="200" stroke="#fff" stroke-width="1.5" opacity="0.8"/>
        <!-- Dagger Guard & Hilt -->
        <rect x="100" y="200" width="40" height="7" rx="3" fill="url(#goldGradient)" stroke="#594305" stroke-width="1"/>
        <rect x="113" y="207" width="14" height="22" rx="2" fill="url(#goldGradient)" stroke="#594305" stroke-width="1"/>
        <circle cx="120" cy="233" r="5" fill="url(#goldGradient)" stroke="#594305" stroke-width="1"/>

        <!-- Center Shield -->
        <path d="M52 110 L188 110 C188 155 165 190 120 206 C75 190 52 155 52 110 Z" 
              fill="#0e1730" stroke="url(#goldGradient)" stroke-width="2.5" opacity="0.9"/>

        <!-- Center FORCE ONE Brand Text -->
        <rect x="68" y="132" width="104" height="25" rx="3" fill="#120606" stroke="url(#goldGradient)" stroke-width="1.8"/>
        <text x="120" y="150" fill="#fdf2bb" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="2" font-family="'Impact', 'Arial Black', sans-serif">FORCE</text>
        <rect x="68" y="157" width="104" height="25" rx="3" fill="#120606" stroke="url(#goldGradient)" stroke-width="1.8"/>
        <text x="120" y="175" fill="#fdf2bb" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="2" font-family="'Impact', 'Arial Black', sans-serif">ONE</text>

        <!-- Bottom Crimson Ribbon Banner -->
        <path d="M30 200 C70 235 170 235 210 200 L216 220 C170 262 70 262 24 220 Z" 
              fill="url(#ribbonGradient)" stroke="url(#goldGradient)" stroke-width="2"/>
        
        <!-- Motto Text (Sanskrit/Devanagari) -->
        <text x="120" y="235" fill="#ffe994" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="0.5">यतः शौर्यं ततो जयः</text>
      </svg>

      <h2>FORCE ONE</h2>
      <div class="motto">यतः शौर्यं ततो जयः</div>
      
      <input type="text" id="callsign" class="login-input" placeholder="HQ CALLSIGN" value="COMMAND HQ">
      <input type="password" id="password" class="login-input" placeholder="ENTER ACCESS KEY">
      <button class="login-btn" onclick="validateLogin()">ENTER TACTICAL HQ</button>
      <div id="login-err" class="login-error">ACCESS DENIED: INVALID PASSWORD</div>
    </div>
  </div>

  <!-- ================= 2. DASHBOARD SHELL ================= -->
  <div id="app-container">
    <!-- TOP NAVIGATION -->
    <header class="top-header">
      <div class="header-left">
        <button class="header-btn btn-ied">▲ +IED</button>
        <button class="header-btn btn-breach">● +BREACH</button>
        <button class="header-btn">📐 MEASURE</button>
        <button class="header-btn btn-logout" onclick="logoutHQ()">🔒 LOGOUT</button>
      </div>

      <div style="display:flex; align-items:center; gap:12px;">
        <!-- SIREN TOGGLE SWITCH -->
        <button id="sirenBtn" class="siren-toggle siren-on" onclick="toggleSiren()">
          🚨 SIREN: ON
        </button>
      </div>
    </header>

    <!-- WORKSPACE -->
    <div class="workspace">
      <!-- SIDEBAR WITH UNITS -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <span>OPERATIONAL ELEMENTS</span>
          <span class="count" id="unitCount">6 UNITS</span>
        </div>
        <div class="unit-list" id="unitListContainer"></div>
      </aside>

      <!-- LEAFLET TACTICAL MAP -->
      <div id="map"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    /* ================= LOGIN & AUTHENTICATION ================= */
    function validateLogin() {
      const pass = document.getElementById('password').value;
      const err = document.getElementById('login-err');

      if (pass === 'Forceone@123') {
        err.style.display = 'none';
        initAudio();
        document.getElementById('login-overlay').style.display = 'none';
        initMap();
        renderUnits();
        listenToCommandoBroadcast();
      } else {
        err.style.display = 'block';
        document.getElementById('password').value = '';
      }
    }

    function logoutHQ() {
      location.reload();
    }

    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') validateLogin();
    });

    /* ================= AUDIO & 3-SECOND SIREN ================= */
    let sirenEnabled = true;
    let audioCtx = null;
    let sirenOsc = null;
    let sirenGain = null;
    let sirenTimer = null;
    let activeDistressSet = new Set();

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function toggleSiren() {
      sirenEnabled = !sirenEnabled;
      const btn = document.getElementById('sirenBtn');

      if (sirenEnabled) {
        btn.textContent = "🚨 SIREN: ON";
        btn.className = "siren-toggle siren-on";
      } else {
        btn.textContent = "🔇 SIREN: OFF";
        btn.className = "siren-toggle siren-off";
        stopSirenImmediately();
      }
    }

    function triggerDistressSiren(commandoName) {
      if (!sirenEnabled) return;
      initAudio();
      stopSirenImmediately();

      try {
        sirenOsc = audioCtx.createOscillator();
        sirenGain = audioCtx.createGain();

        sirenOsc.type = 'sawtooth';
        const now = audioCtx.currentTime;

        // Realistic warble sweep (700Hz to 1200Hz)
        sirenOsc.frequency.setValueAtTime(700, now);
        sirenOsc.frequency.linearRampToValueAtTime(1200, now + 0.5);
        sirenOsc.frequency.linearRampToValueAtTime(700, now + 1.0);
        sirenOsc.frequency.linearRampToValueAtTime(1200, now + 1.5);
        sirenOsc.frequency.linearRampToValueAtTime(700, now + 2.0);
        sirenOsc.frequency.linearRampToValueAtTime(1200, now + 2.5);
        sirenOsc.frequency.linearRampToValueAtTime(700, now + 3.0);

        sirenGain.gain.setValueAtTime(0.3, now);
        sirenOsc.connect(sirenGain);
        sirenGain.connect(audioCtx.destination);
        sirenOsc.start();

        // STRICT 3-SECOND TIMEOUT
        sirenTimer = setTimeout(() => {
          stopSirenImmediately();
        }, 3000);

        announceCommandoVoice(commandoName);

      } catch (err) {
        console.error("Audio error:", err);
      }
    }

    function stopSirenImmediately() {
      if (sirenTimer) {
        clearTimeout(sirenTimer);
        sirenTimer = null;
      }
      if (sirenOsc) {
        try {
          sirenOsc.stop();
          sirenOsc.disconnect();
        } catch(e) {}
        sirenOsc = null;
      }
    }

    function announceCommandoVoice(commandoName) {
      if (!sirenEnabled) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(`Distress beacon activated by ${commandoName}`);
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    /* ================= TACTICAL UNITS STATE ================= */
    const units = [
      { id: "b5c3", name: "Bravo - Hit 5 - Commando 3", status: "OFFLINE", lat: 19.144, lng: 72.875, grp: "Bravo", acc: "N/A", hdg: "0°", distress: false },
      { id: "c3c2", name: "Charlie - Hit 3 - Commando 2", status: "OFFLINE", lat: 19.146, lng: 72.878, grp: "Charlie", acc: "N/A", hdg: "0°", distress: false },
      { id: "c3c3", name: "Charlie - Hit 3 - Commando 3", status: "OFFLINE", lat: 19.148, lng: 72.882, grp: "Charlie", acc: "N/A", hdg: "0°", distress: false },
      { id: "c3c5", name: "Charlie - Hit 3 - Commando 5", status: "ONLINE", lat: 19.151, lng: 72.885, grp: "Charlie", acc: "±18.8m", hdg: "0°", distress: false },
      { id: "c3c6", name: "Charlie - Hit 3 - Commando 6", status: "OFFLINE", lat: 19.149, lng: 72.889, grp: "Charlie", acc: "N/A", hdg: "0°", distress: false },
      { id: "c5c2", name: "Charlie - Hit 5 - Commando 2", status: "OFFLINE", lat: 19.142, lng: 72.880, grp: "N/A", acc: "N/A", hdg: "0°", distress: false }
    ];

    let map = null;
    let markers = {};

    function initMap() {
      if (map) return;
      map = L.map('map', { zoomControl: false }).setView([19.148, 72.882], 15);
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      units.forEach(u => {
        const marker = L.circleMarker([u.lat, u.lng], {
          radius: 8,
          fillColor: u.status === 'ONLINE' ? '#2ecc71' : (u.status === 'STALE' ? '#ffaa00' : '#7f8c8d'),
          color: '#ffffff',
          weight: 2,
          opacity: 1,
          fillOpacity: 0.9
        }).addTo(map);

        marker.bindPopup(`<b>${u.name}</b><br>GRP: ${u.grp}<br>STATUS: ${u.status}`);
        markers[u.id] = marker;
      });
    }

    function renderUnits() {
      const container = document.getElementById('unitListContainer');
      container.innerHTML = '';

      units.forEach(u => {
        const card = document.createElement('div');
        const isDistress = u.distress;
        card.className = `unit-card ${isDistress ? 'distress-active' : ''} ${u.status === 'STALE' ? 'selected' : ''}`;

        let statusText = '';
        if (isDistress) {
          statusText = `<span class="unit-status status-distress">🚨 DISTRESS</span>`;
        } else if (u.status === 'ONLINE') {
          statusText = `<span class="unit-status status-online">● ONLINE</span>`;
        } else if (u.status === 'STALE') {
          statusText = `<span class="unit-status status-stale">⚠️ STALE</span>`;
        } else {
          statusText = `<span class="unit-status status-offline">○ OFFLINE</span>`;
        }

        card.innerHTML = `
          <div class="unit-card-title">
            <span>${u.name}</span>
            ${statusText}
          </div>
          <div class="unit-meta">
            ${u.status === 'OFFLINE' 
              ? `BEACON OFFLINE (LKP) | GRP: ${u.grp}` 
              : `ACC: ${u.acc} | HDG: ${u.hdg} \vert{} GRP:${u.grp}`}
          </div>
        `;

        card.onclick = () => {
          if (map && markers[u.id]) {
            map.flyTo([u.lat, u.lng], 16);
            markers[u.id].openPopup();
          }
        };

        container.appendChild(card);
      });
    }

    /* ================= SYNC WITH FIELD COMMANDO BEACON ================= */
    function listenToCommandoBroadcast() {
      if ('BroadcastChannel' in window) {
        const channel = new BroadcastChannel('f1_tactical_channel');
        channel.onmessage = (event) => {
          handleIncomingTelemetry(event.data);
        };
      }

      window.addEventListener('storage', (event) => {
        if (event.key === 'f1_beacon_signal' && event.newValue) {
          try {
            const data = JSON.parse(event.newValue);
            handleIncomingTelemetry(data);
          } catch(e) {}
        }
      });
    }

    function handleIncomingTelemetry(data) {
      if (!data || !data.unitId) return;

      const target = units.find(u => u.id === data.unitId);
      if (!target) return;

      if (data.lat && data.lng) {
        target.lat = data.lat;
        target.lng = data.lng;
        if (markers[target.id]) {
          markers[target.id].setLatLng([data.lat, data.lng]);
        }
      }

      target.status = data.status || 'ONLINE';
      target.acc = data.acc ? `±${data.acc}m` : target.acc;
      target.hdg = data.hdg ? `${data.hdg}°` : target.hdg;

      // DISTRESS SOS LOGIC
      if (data.distress === true) {
        target.distress = true;
        if (!activeDistressSet.has(target.id)) {
          activeDistressSet.add(target.id);
          triggerDistressSiren(target.name);
        }
      } else if (data.distress === false) {
        target.distress = false;
        activeDistressSet.delete(target.id);
      }

      renderUnits();
    }
  </script>
</body>
</html>
