<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORCE ONE - Tactical Command</title>
  <style>
    :root {
      --bg-dark: #0a0f18;
      --card-bg: #111a28;
      --accent-blue: #0088ff;
      --alert-red: #ff3344;
      --text-gold: #d4af37;
      --text-light: #e0e8f0;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
    }

    /* ================= LOGIN SCREEN ================= */
    #login-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #132035 0%, #06090e 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .login-box {
      background: rgba(17, 26, 40, 0.95);
      border: 1px solid rgba(212, 175, 55, 0.4);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(212, 175, 55, 0.2);
      border-radius: 8px;
      padding: 30px 40px;
      width: 340px;
      text-align: center;
    }

    .f1-logo {
      width: 140px;
      height: auto;
      margin-bottom: 12px;
      filter: drop-shadow(0px 0px 8px rgba(212, 175, 55, 0.5));
    }

    .login-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #fff;
      margin: 0;
    }

    .login-motto {
      font-size: 13px;
      color: var(--text-gold);
      margin: 4px 0 20px 0;
      letter-spacing: 1px;
    }

    .login-input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      box-sizing: border-box;
      background: #090e17;
      border: 1px solid #203550;
      color: #fff;
      border-radius: 4px;
      font-size: 14px;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #a81c1c;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 1.5px;
    }

    .login-btn:hover {
      background: #cc2222;
    }

    /* ================= DASHBOARD HEADER CONTROLS ================= */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0d1522;
      padding: 10px 20px;
      border-bottom: 1px solid #1f2d42;
    }

    .siren-toggle-btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid #444;
      transition: all 0.2s ease;
    }

    .siren-enabled {
      background: #1a522a;
      color: #44ff77;
      border-color: #27ae60;
    }

    .siren-disabled {
      background: #4a1515;
      color: #ff5555;
      border-color: #c0392b;
    }
  </style>
</head>
<body>

  <!-- ================= 1. LOGIN OVERLAY WITH LOGO ================= -->
  <div id="login-overlay">
    <div class="login-box">
      <img src="force_one_logo.png" alt="Force One" class="f1-logo">
      <div class="login-title">FORCE ONE</div>
      <div class="login-motto">यतः शौर्यं ततो जयः</div>

      <input type="text" id="callsign" class="login-input" placeholder="OPERATOR CALLSIGN" value="COMMAND HQ">
      <input type="password" id="access-key" class="login-input" placeholder="ACCESS KEY" value="••••••••">
      <button class="login-btn" onclick="authenticateUser()">ENTER TACTICAL HQ</button>
    </div>
  </div>

  <!-- ================= 2. DASHBOARD BAR WITH SIREN TOGGLE ================= -->
  <div class="top-bar">
    <div style="font-weight:bold; letter-spacing:1px; color:#44b0ff;">
      TACTICAL BLUE FORCE DASHBOARD
    </div>
    <div>
      <!-- SIREN MASTER TOGGLE BUTTON -->
      <button id="sirenMasterBtn" class="siren-toggle-btn siren-enabled" onclick="toggleSirenMaster()">
        🚨 SIREN: ON
      </button>
    </div>
  </div>

  <!-- ================= 3. AUDIO & DISTRESS LOGIC SCRIPT ================= -->
  <script>
    // Unlock dashboard
    function authenticateUser() {
      // Initialize browser audio context on first click
      initAudioEngine();
      document.getElementById('login-overlay').style.display = 'none';
    }

    /* ---------------- SIREN & AUDIO ENGINE ---------------- */
    let sirenMasterEnabled = true; // Master toggle status
    let audioCtx = null;
    let sirenOsc = null;
    let sirenGain = null;
    let sirenTimer = null;
    let activeDistressUnits = new Set(); // Prevents sound from re-triggering constantly

    // Browser audio setup
    function initAudioEngine() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    // Toggle Siren ON / OFF button
    function toggleSirenMaster() {
      sirenMasterEnabled = !sirenMasterEnabled;
      const btn = document.getElementById('sirenMasterBtn');

      if (sirenMasterEnabled) {
        btn.innerText = "🚨 SIREN: ON";
        btn.className = "siren-toggle-btn siren-enabled";
      } else {
        btn.innerText = "🔇 SIREN: OFF";
        btn.className = "siren-toggle-btn siren-disabled";
        // Stop any siren playing immediately
        stopTacticalSiren();
      }
    }

    // Play Siren for EXACTLY 3 Seconds
    function startTacticalSiren(durationMs = 3000) {
      if (!sirenMasterEnabled) return;
      initAudioEngine();
      stopTacticalSiren(); // Reset any existing siren

      try {
        sirenOsc = audioCtx.createOscillator();
        sirenGain = audioCtx.createGain();

        sirenOsc.type = 'sawtooth';
        const now = audioCtx.currentTime;

        // Realistic emergency wail pattern (600Hz <-> 1100Hz)
        sirenOsc.frequency.setValueAtTime(650, now);
        sirenOsc.frequency.linearRampToValueAtTime(1150, now + 0.5);
        sirenOsc.frequency.linearRampToValueAtTime(650, now + 1.0);
        sirenOsc.frequency.linearRampToValueAtTime(1150, now + 1.5);
        sirenOsc.frequency.linearRampToValueAtTime(650, now + 2.0);
        sirenOsc.frequency.linearRampToValueAtTime(1150, now + 2.5);
        sirenOsc.frequency.linearRampToValueAtTime(650, now + 3.0);

        sirenGain.gain.setValueAtTime(0.25, now);

        sirenOsc.connect(sirenGain);
        sirenGain.connect(audioCtx.destination);
        sirenOsc.start();

        // STRICT CUTOFF AT 3 SECONDS
        sirenTimer = setTimeout(() => {
          stopTacticalSiren();
        }, durationMs);

      } catch (err) {
        console.error("Audio error:", err);
      }
    }

    // Stop Siren Immediately
    function stopTacticalSiren() {
      if (sirenTimer) {
        clearTimeout(sirenTimer);
        sirenTimer = null;
      }
      if (sirenOsc) {
        try {
          sirenOsc.stop();
          sirenOsc.disconnect();
        } catch (e) {}
        sirenOsc = null;
      }
    }

    // Play Commando Distress Voice Alert
    function playCommandoVoice(commandoName) {
      if (!sirenMasterEnabled) return;

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Stop any pending speech
        const msg = new SpeechSynthesisUtterance(`Alert! Distress button pressed by ${commandoName}`);
        msg.rate = 1.0;
        msg.pitch = 1.0;
        msg.volume = 1.0;
        window.speechSynthesis.speak(msg);
      }
    }

    /* ---------------- DISTRESS EVENT HANDLER ---------------- */
    // Call this function whenever a unit triggers Distress
    function onCommandoDistress(unitId, unitName) {
      // Check if siren toggle is enabled
      if (!sirenMasterEnabled) return;

      // Only trigger once when distress is first activated
      if (!activeDistressUnits.has(unitId)) {
        activeDistressUnits.add(unitId);

        // 1. Play siren for exactly 3 seconds
        startTacticalSiren(3000);

        // 2. Announce commando voice
        playCommandoVoice(unitName);
      }
    }

    // Call this function when the distress is cleared/resolved
    function onCommandoDistressCleared(unitId) {
      activeDistressUnits.delete(unitId);
    }
  </script>
</body>
</html>
