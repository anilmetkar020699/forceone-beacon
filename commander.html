<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Force One - Commando Beacon</title>
    
    <style>
        :root {
            --bg-dark: #0a0e17;
            --panel-bg: #111827;
            --border: #1e293b;
            --accent-green: #10b981;
            --accent-blue: #38bdf8;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, -apple-system, sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }

        .beacon-card {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            padding: 24px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-title {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--accent-blue);
        }

        .status-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 6px;
            background: #0f172a;
            border: 1px solid var(--border);
            font-size: 0.85rem;
            font-weight: bold;
        }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #64748b; }
        .status-dot.active { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
        .status-dot.weak { background: var(--accent-yellow); box-shadow: 0 0 8px var(--accent-yellow); }
        .status-dot.distress { background: var(--accent-red); box-shadow: 0 0 10px var(--accent-red); animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
        }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.75rem; color: var(--text-muted); font-weight: bold; }
        .form-group input, .form-group select {
            background: #0f172a;
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--accent-blue); }

        .telemetry-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            font-size: 0.75rem;
        }
        .tel-item span { color: var(--text-muted); display: block; margin-bottom: 2px; }
        .tel-item strong { color: #fff; font-size: 0.85rem; }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 6px;
            border: none;
            font-weight: 900;
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-start { background: var(--accent-blue); color: #0a0e17; }
        .btn-start.tracking { background: #dc2626; color: #fff; }

        .btn-sos {
            background: #7f1d1d;
            border: 2px solid var(--accent-red);
            color: #fff;
            margin-top: 8px;
        }
        .btn-sos.active {
            background: var(--accent-red);
            animation: pulse 1.2s infinite;
        }

        .wake-notice {
            font-size: 0.7rem;
            color: var(--accent-yellow);
            text-align: center;
            line-height: 1.4;
        }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

    <div class="beacon-card">
        <div class="header-title">FORCE ONE BEACON</div>

        <div class="status-pill">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusLabel">STANDBY</span>
        </div>

        <div class="form-group">
            <label>COMMANDO CALLSIGN</label>
            <input type="text" id="callsignInput" placeholder="e.g. Charlie - Hit 3 - Commando 4">
        </div>

        <div class="form-group">
            <label>TACTICAL GROUP</label>
            <select id="groupSelect">
                <option value="Alfa">Alfa</option>
                <option value="Bravo">Bravo</option>
                <option value="Charlie" selected>Charlie</option>
                <option value="Delta">Delta</option>
                <option value="SOT">SOT</option>
                <option value="Sniper">Sniper</option>
                <option value="BD">BD</option>
            </select>
        </div>

        <div class="telemetry-grid">
            <div class="tel-item">
                <span>LATITUDE</span>
                <strong id="dispLat">--.------</strong>
            </div>
            <div class="tel-item">
                <span>LONGITUDE</span>
                <strong id="dispLng">--.------</strong>
            </div>
            <div class="tel-item">
                <span>ACCURACY</span>
                <strong id="dispAcc">±-- m</strong>
            </div>
            <div class="tel-item">
                <span>BEARING / HDG</span>
                <strong id="dispHdg">--°</strong>
            </div>
        </div>

        <div class="wake-notice">
            ⚡ Self-Healing GPS Active. Signal automatically resumes when available.
        </div>

        <button id="trackBtn" class="btn btn-start" onclick="toggleTracking()">START BEACON</button>
        <button id="sosBtn" class="btn btn-sos" onclick="toggleCasualtySOS()" disabled>🚨 CASUALTY / MAYDAY</button>
    </div>

    <script>
        // --- 1. FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyAXJsxJDkSxiYFHRKWKjPVkWSDcnAXb4_g",
            authDomain: "forceone-ops.firebaseapp.com",
            databaseURL: "https://forceone-ops-default-rtdb.firebaseio.com",
            projectId: "forceone-ops",
            storageBucket: "forceone-ops.firebasestorage.app",
            messagingSenderId: "1035569483131",
            appId: "1:1035569483131:web:ca675d22897f344f2ac1de"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // --- 2. STATE VARIABLES ---
        let isTracking = false;
        let isCasualty = false;
        let watchId = null;
        let wakeLock = null;
        let currentCleanKey = null;
        let currentCommandoRef = null;

        // Auto-reconnect & Watchdog engine
        let lastFixTimestamp = 0;
        let watchdogInterval = null;
        let lastPayload = null;

        // --- 3. AUTO-RECONNECT ON NETWORK RETURN ---
        database.ref(".info/connected").on("value", (snap) => {
            const isConnected = snap.val() === true;
            if (isConnected && isTracking && currentCommandoRef) {
                // Re-register automatic disconnect cleanup on reconnect
                currentCommandoRef.onDisconnect().remove();

                // Immediately push timestamped heartbeat so dashboard marks online instantly
                if (lastPayload) {
                    lastPayload.lastUpdated = Date.now();
                    lastPayload.status = "ONLINE";
                    currentCommandoRef.set(lastPayload).catch(() => {});
                }
            }
        });

        // --- 4. SCREEN WAKE LOCK ENGINE ---
        async function acquireWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.warn('Wake Lock request note:', err);
            }
        }

        async function releaseWakeLock() {
            if (wakeLock !== null) {
                try { await wakeLock.release(); } catch (e) {}
                wakeLock = null;
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible' && isTracking) {
                await acquireWakeLock();
            }
        });

        // --- 5. GPS HARDWARE LISTENERS & DYNAMIC RE-ARMING ---
        function armGpsWatcher() {
            if (watchId !== null) {
                try { navigator.geolocation.clearWatch(watchId); } catch (e) {}
                watchId = null;
            }

            // Balanced options: Accepts any fix within 5 seconds without stalling on weak satellite lock
            const options = {
                enableHighAccuracy: true,
                maximumAge: 3000,
                timeout: 7000
            };

            watchId = navigator.geolocation.watchPosition(
                handlePositionSuccess,
                handlePositionError,
                options
            );
        }

        // Fallback coarse check when GPS is weak/indoor (Cell / Wi-Fi Assisted)
        function triggerCoarseFallback() {
            if (!isTracking) return;
            navigator.geolocation.getCurrentPosition(
                handlePositionSuccess,
                (err) => console.warn("Coarse fallback searching:", err.message),
                {
                    enableHighAccuracy: false,
                    maximumAge: 10000,
                    timeout: 5000
                }
            );
        }

        // Watchdog: If no coordinates arrive for 7 seconds, revive GPS & trigger coarse fallback
        function runGpsWatchdog() {
            if (!isTracking) return;
            const now = Date.now();
            
            // Re-acquire screen wake lock if released by phone
            if (!wakeLock && document.visibilityState === 'visible') {
                acquireWakeLock();
            }

            if (now - lastFixTimestamp > 7000) {
                updateStatusUI("WEAK SIGNAL / RE-ACQUIRING", "weak");
                // Attempt low-precision network fix
                triggerCoarseFallback();
                // Re-arm main GPS hardware listener
                armGpsWatcher();
            }
        }

        // --- 6. START / STOP TRACKING ---
        function toggleTracking() {
            if (isTracking) {
                stopTracking();
            } else {
                startTracking();
            }
        }

        function startTracking() {
            const rawCallsign = document.getElementById("callsignInput").value.trim();
            if (!rawCallsign) {
                alert("Please enter Commando Callsign before starting beacon.");
                return;
            }

            currentCleanKey = rawCallsign.toUpperCase().replace(/[.#$\[\]\/]/g, '_');
            currentCommandoRef = database.ref("commandos/" + currentCleanKey);

            currentCommandoRef.onDisconnect().remove();

            if (!navigator.geolocation) {
                alert("Geolocation is not supported on this device.");
                return;
            }

            isTracking = true;
            lastFixTimestamp = Date.now();

            document.getElementById("callsignInput").disabled = true;
            document.getElementById("groupSelect").disabled = true;
            document.getElementById("trackBtn").innerText = "STOP BEACON";
            document.getElementById("trackBtn").classList.add("tracking");
            document.getElementById("sosBtn").disabled = false;
            updateStatusUI("CONNECTING GPS...", "weak");

            acquireWakeLock();
            armGpsWatcher();

            // Run watchdog every 4 seconds
            if (watchdogInterval) clearInterval(watchdogInterval);
            watchdogInterval = setInterval(runGpsWatchdog, 4000);
        }

        function stopTracking() {
            if (watchdogInterval) {
                clearInterval(watchdogInterval);
                watchdogInterval = null;
            }

            if (watchId !== null) {
                try { navigator.geolocation.clearWatch(watchId); } catch (e) {}
                watchId = null;
            }

            if (currentCommandoRef) {
                currentCommandoRef.remove();
                currentCommandoRef = null;
            }

            releaseWakeLock();

            isTracking = false;
            isCasualty = false;
            lastPayload = null;

            document.getElementById("callsignInput").disabled = false;
            document.getElementById("groupSelect").disabled = false;
            document.getElementById("trackBtn").innerText = "START BEACON";
            document.getElementById("trackBtn").classList.remove("tracking");
            document.getElementById("sosBtn").disabled = true;
            document.getElementById("sosBtn").classList.remove("active");
            document.getElementById("sosBtn").innerText = "🚨 CASUALTY / MAYDAY";
            updateStatusUI("STANDBY", "");
        }

        // --- 7. TELEMETRY PROCESSING ---
        function handlePositionSuccess(pos) {
            if (!isTracking || !currentCommandoRef) return;

            lastFixTimestamp = Date.now();

            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            // Accepts any accuracy without rejection (minimum signal tolerance)
            const accuracy = pos.coords.accuracy || 15;
            const heading = pos.coords.heading || 0;

            document.getElementById("dispLat").innerText = lat.toFixed(6);
            document.getElementById("dispLng").innerText = lng.toFixed(6);
            document.getElementById("dispAcc").innerText = `±${accuracy.toFixed(1)}m`;
            document.getElementById("dispHdg").innerText = `${Math.round(heading)}°`;

            const rawCallsign = document.getElementById("callsignInput").value.trim();
            const selectedGroup = document.getElementById("groupSelect").value;

            lastPayload = {
                callsign: rawCallsign,
                group: selectedGroup,
                lat: lat,
                lng: lng,
                accuracy: accuracy,
                heading: heading,
                status: "ONLINE",
                casualty: isCasualty,
                audioActive: false,
                lastUpdated: Date.now()
            };

            currentCommandoRef.set(lastPayload);

            if (!isCasualty) {
                // If accuracy is high, green; if minimum/coarse (>50m), show online with amber status
                if (accuracy > 65) {
                    updateStatusUI("ONLINE (MINIMUM GPS)", "weak");
                } else {
                    updateStatusUI("ONLINE (GPS LOCKED)", "active");
                }
            }
        }

        function handlePositionError(err) {
            console.warn("GPS Searching note:", err.message);
            // Do not stop. Trigger coarse fallback immediately
            triggerCoarseFallback();
        }

        // --- 8. CASUALTY DISTRESS SOS ---
        function toggleCasualtySOS() {
            if (!isTracking || !currentCommandoRef) return;

            isCasualty = !isCasualty;
            const sosBtn = document.getElementById("sosBtn");

            if (isCasualty) {
                sosBtn.classList.add("active");
                sosBtn.innerText = "🚨 MAYDAY ACTIVE (TAP TO CANCEL)";
                updateStatusUI("MAYDAY / DISTRESS", "distress");
                currentCommandoRef.update({ casualty: true, lastUpdated: Date.now() });
            } else {
                sosBtn.classList.remove("active");
                sosBtn.innerText = "🚨 CASUALTY / MAYDAY";
                updateStatusUI("ONLINE (GPS LOCKED)", "active");
                currentCommandoRef.update({ casualty: false, lastUpdated: Date.now() });
            }
        }

        function updateStatusUI(label, dotClass) {
            document.getElementById("statusLabel").innerText = label;
            const dot = document.getElementById("statusDot");
            dot.className = "status-dot";
            if (dotClass) dot.classList.add(dotClass);
        }
    </script>
</body>
</html>
