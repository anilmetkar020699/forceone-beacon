<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Force One - Tactical C2 Dashboard</title>

    <style>
        :root {
            --bg-dark: #0a0e17;
            --panel-bg: #111827;
            --border: #1e293b;
            --accent-green: #10b981;
            --accent-blue: #38bdf8;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, -apple-system, sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        #authOverlay {
            position: fixed; inset: 0; background: rgba(8, 12, 20, 0.98);
            z-index: 9999; display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(8px);
        }
        .auth-card {
            background: #111827; border: 1px solid #334155; padding: 36px 30px;
            border-radius: 12px; width: 360px; text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9), 0 0 20px rgba(56, 189, 248, 0.15);
        }
        .auth-logo-svg {
            width: 84px; height: 84px; margin: 0 auto 10px auto; display: block;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.35));
        }
        .auth-logo-img {
            width: 150px; height: auto; margin: 0 auto 8px auto; display: block;
            filter: drop-shadow(0 0 14px rgba(56, 189, 248, 0.3));
        }
        .auth-welcome-title {
            font-size: 1.9rem; font-weight: 900; letter-spacing: 4px;
            color: #ffffff; text-transform: uppercase; margin-top: 6px;
        }
        .auth-subtitle {
            font-size: 1.05rem; font-weight: 700; letter-spacing: 1.5px;
            color: #f59e0b; margin: 4px 0 24px 0;
            font-family: "Noto Sans Devanagari", "Mangal", "Nirmala UI", sans-serif;
        }
        .auth-card input {
            width: 100%; padding: 12px 14px; margin-bottom: 14px; background: #0f172a;
            border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 0.95rem; text-align: center;
            letter-spacing: 1px; outline: none; transition: 0.2s border;
        }
        .auth-card input:focus { border-color: var(--accent-blue); }
        .auth-card button {
            width: 100%; padding: 12px; background: var(--accent-blue); border: none;
            border-radius: 6px; font-weight: 900; font-size: 0.9rem; letter-spacing: 1.5px;
            cursor: pointer; color: #0a0e17; text-transform: uppercase; transition: 0.2s background;
        }
        .auth-card button:hover { background: #7dd3fc; }
        .auth-card button:disabled { opacity: 0.6; cursor: wait; }
        #authError { color: #fca5a5; font-size: 0.78rem; min-height: 18px; margin-bottom: 10px; }

        header {
            height: 54px; background: var(--panel-bg); border-bottom: 2px solid #334155;
            display: flex; justify-content: space-between; align-items: center; padding: 0 16px; z-index: 1000;
        }
        .op-title { font-weight: 900; font-size: 1.05rem; letter-spacing: 2px; color: var(--accent-blue); }
        .stat-badges { display: flex; gap: 14px; font-size: 0.8rem; font-weight: bold; }
        .badge { padding: 4px 8px; border-radius: 4px; background: #0f172a; border: 1px solid var(--border); }

        #casualtyNoticeBar {
            display: none; background: #7f1d1d; border-bottom: 2px solid var(--accent-red);
            color: #fff; padding: 8px 16px; font-size: 0.85rem; font-weight: bold;
            justify-content: space-between; align-items: center; z-index: 2000;
        }

        .workspace { flex: 1; display: flex; position: relative; overflow: hidden; width: 100%; }
        #tacticalMap { flex: 1; height: 100%; width: 100%; background: #000; }

        .sidebar {
            width: 340px; background: var(--panel-bg); border-left: 2px solid var(--border);
            display: flex; flex-direction: column; transition: all 0.2s ease-in-out;
        }
        .sidebar-header { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.85rem; font-weight: bold; color: var(--accent-blue); display: flex; justify-content: space-between; align-items: center; }
        .unit-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }

        .unit-card { background: #0f172a; border: 1px solid var(--border); border-radius: 6px; padding: 10px; cursor: pointer; transition: 0.2s; }
        .unit-card:hover { border-color: var(--accent-blue); }
        .unit-card.casualty { border: 2px solid var(--accent-red); background: #3b0764; animation: pulseRed 1.5s infinite; }
        .unit-card.stale { border-color: var(--accent-yellow); }
        .unit-card.offline { opacity: 0.55; }

        @keyframes pulseRed {
            0%, 100% { border-color: var(--accent-red); }
            50% { border-color: #fca5a5; }
        }

        .btn-listen {
            width: 100%; margin-top: 8px; padding: 6px; font-size: 0.75rem; font-weight: bold;
            border: none; border-radius: 4px; cursor: pointer; background: #dc2626; color: #fff;
        }
        .btn-listen.monitoring { background: var(--accent-green); color: #000; }

        .btn-tool {
            background: #1e293b; color: #fff; border: 1px solid var(--border);
            padding: 5px 9px; font-size: 0.72rem; border-radius: 4px; cursor: pointer; margin-left: 3px;
        }
        .btn-tool.active { background: var(--accent-blue); color: #000; font-weight: bold; }
        .btn-tool.btn-threat { border-color: #dc2626; color: #fca5a5; }
        .btn-tool.btn-threat.active { background: #dc2626; color: #fff; font-weight: bold; }
        .btn-tool.btn-ied { border-color: #d97706; color: #fde68a; }
        .btn-tool.btn-ied.active { background: #d97706; color: #000; font-weight: bold; }
        .btn-logout { background: #dc2626; border-color: #ef4444; font-weight: bold; }

        .commando-marker {
            width: 28px; height: 28px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-size: 11px;
            font-weight: 900; color: #fff; border: 2px solid #fff; box-shadow: 0 0 10px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }
        .commando-marker.marker-casualty { background: var(--accent-red) !important; animation: pulseRed 1s infinite; }
        .commando-marker.marker-offline {
            background: #475569 !important; border: 2px dashed #94a3b8 !important;
            opacity: 0.65; box-shadow: none;
        }

        .dark-tiles { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }
    </style>

    <!-- Leaflet & Firebase SDKs -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

    <audio id="remoteAudioPlayer" autoplay></audio>

    <!-- Login (Firebase Authentication) -->
    <div id="authOverlay">
        <div class="auth-card">
            <!-- Save the logo image as "force-one-logo.png" in the same folder as this file -->
            <img id="authLogoImg" class="auth-logo-img" src="force-one-logo.png" alt="Force One"
                 onerror="this.style.display='none'; document.getElementById('authLogoSvg').style.display='block';">
            <svg id="authLogoSvg" style="display:none" class="auth-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 4L12 18V50C12 73.5 50 96 50 96C50 96 88 73.5 88 50V18L50 4Z" fill="#0f172a" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
                <path d="M50 10L18 22V48C18 67 50 86 50 86C50 86 82 67 82 48V22L50 10Z" stroke="#f59e0b" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M50 18V64" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
                <path d="M43 27L50 18L57 27" fill="#ffffff"/>
                <path d="M38 48H62" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
                <path d="M47 52H53M47 57H53M47 62H53" stroke="#94a3b8" stroke-width="2"/>
                <circle cx="50" cy="68" r="3" fill="#f59e0b"/>
                <path d="M26 40L36 46L29 55L40 50" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M74 40L64 46L71 55L60 50" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M50 74L51.8 78.5L56.5 78.5L52.7 81.2L54.2 85.5L50 83L45.8 85.5L47.3 81.2L43.5 78.5L48.2 78.5L50 74Z" fill="#f59e0b"/>
            </svg>

            <div class="auth-welcome-title">FORCE ONE</div>
            <div class="auth-subtitle">यतः शौर्य ततो जयः</div>

            <input type="password" id="c2Password" placeholder="Enter Password" autocomplete="current-password"
                   onkeydown="if(event.key==='Enter') verifyAccess()">
            <div id="authError"></div>
            <button id="loginBtn" onclick="verifyAccess()">LOGIN</button>
        </div>
    </div>

    <div id="casualtyNoticeBar">
        <span id="casualtyNoticeText">🚨 SIGNAL ALERT: CASUALTY / DISTRESS RECORDED ON GRID</span>
        <button onclick="focusLatestCasualty()" style="background:#fff; color:#000; border:none; padding:4px 10px; font-weight:bold; cursor:pointer; border-radius:4px;">FOCUS TARGET</button>
    </div>

    <header>
        <div class="op-title">FORCE ONE TACTICAL C2</div>
        <div class="stat-badges">
            <div class="badge" style="color:var(--accent-green);">ONLINE: <span id="onlineCount">0</span></div>
            <div class="badge" style="color:var(--accent-red);">CASUALTIES: <span id="casualtyCount">0</span></div>
            <div class="badge" style="color:var(--accent-yellow);">STALE: <span id="staleCount">0</span></div>
        </div>
        <div>
            <button id="toggleRosterBtn" class="btn-tool active" onclick="toggleSidebar()">👁️ HIDE ROSTER</button>

            <button id="btnHostile" class="btn-tool btn-threat" onclick="setQuickMarker('HOSTILE')">🔴 +HOSTILE</button>
            <button id="btnIed" class="btn-tool btn-ied" onclick="setQuickMarker('HAZARD')">⚠️ +IED</button>
            <button id="btnBreach" class="btn-tool btn-breach" onclick="setQuickMarker('BREACH')">🟢 +BREACH</button>

            <button id="measureBtn" class="btn-tool" onclick="toggleMeasureTool()">📏 MEASURE</button>
            <button id="sirenMuteBtn" class="btn-tool" onclick="toggleSirenMute()">🔔 SIREN: ON</button>
            <button class="btn-tool" onclick="clearSitRepMarkers()">🧹 CLEAR SITREPS</button>
            <button class="btn-tool btn-logout" onclick="logoutC2()">🔒 LOGOUT</button>
        </div>
    </header>

    <div class="workspace">
        <div id="tacticalMap"></div>

        <div id="sidebarPanel" class="sidebar">
            <div class="sidebar-header">
                <span>OPERATIONAL ELEMENTS</span>
                <span id="totalUnitsBadge" style="font-size:0.75rem; color:var(--text-muted);">0 UNITS</span>
            </div>
            <div id="unitList" class="unit-list">
                <div style="color:var(--text-muted); font-size:0.8rem; text-align:center; margin-top:20px;">
                    Log in to connect...
                </div>
            </div>
        </div>
    </div>
