<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Force One - Tactical C2 Dashboard</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-dark: #0a0e17;
            --panel-bg: #111827;
            --border: #1e293b;
            
            /* Status Colors */
            --color-online: #15803d;             /* Dark Green */
            --color-relay: #f59e0b;              /* Amber / BLE Proximity Relay */
            --color-offline: rgba(148, 163, 184, 0.45); /* Muted Slate */
            --color-gps-lost: rgba(234, 179, 8, 0.65);  /* Warning Amber */
            --color-distress: #dc2626;           /* Solid Red */
            
            --accent-blue: #38bdf8;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, -apple-system, sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* Firebase Auth Login Overlay */
        #authOverlay {
            position: fixed; inset: 0; background: rgba(8, 12, 20, 0.98); 
            z-index: 9999; display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(8px);
        }
        .auth-card {
            background: #111827; border: 1px solid #334155; padding: 36px 30px; 
            border-radius: 12px; width: 380px; max-width: 90vw; text-align: center; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9), 0 0 20px rgba(56, 189, 248, 0.15);
        }
        
        .auth-logo-svg {
            width: 84px; height: 84px; margin: 0 auto 10px auto; display: block;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.35));
        }
        .auth-welcome-title {
            font-size: 1.85rem; font-weight: 900; letter-spacing: 3px; 
            color: #ffffff; text-transform: uppercase; margin-top: 6px;
        }
        .auth-subtitle {
            font-size: 0.72rem; font-weight: 700; letter-spacing: 2.5px; 
            color: var(--accent-blue); text-transform: uppercase; margin-bottom: 22px;
        }

        .auth-card input {
            width: 100%; padding: 12px 14px; margin-bottom: 14px; background: #0f172a; 
            border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 0.95rem; text-align: center;
            letter-spacing: 1px; outline: none; transition: 0.2s border;
        }
        .auth-card input:focus { border-color: var(--accent-blue); }
        .auth-card button {
            width: 100%; padding: 12px; background: var(--accent-blue); border: none; 
            border-radius: 6px; font-weight: 900; font-size: 0.9rem; letter-spacing: 1.5px; 
            cursor: pointer; color: #0a0e17; text-transform: uppercase; transition: 0.2s background;
        }
        .auth-card button:hover { background: #7dd3fc; }
        .auth-card button:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Header Operations Bar */
        header { 
            min-height: 54px; background: var(--panel-bg); border-bottom: 2px solid #334155; 
            display: flex; justify-content: space-between; align-items: center; padding: 6px 16px; 
            z-index: 1000; flex-wrap: wrap; gap: 8px;
        }
        .header-brand { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .op-title { font-weight: 900; font-size: 1.05rem; letter-spacing: 2px; color: var(--accent-blue); }
        .stat-badges { display: flex; gap: 8px; font-size: 0.8rem; font-weight: bold; }
        .badge { padding: 4px 8px; border-radius: 4px; background: #0f172a; border: 1px solid var(--border); white-space: nowrap; }

        .toolbar-actions {
            display: flex; align-items: center; gap: 4px; overflow-x: auto; 
            max-width: 100%; -webkit-overflow-scrolling: touch; scrollbar-width: none;
        }
        .toolbar-actions::-webkit-scrollbar { display: none; }

        /* Emergency Casualty Banner */
        #casualtyNoticeBar { 
            display: none; background: #7f1d1d; border-bottom: 2px solid var(--color-distress); 
            color: #fff; padding: 8px 16px; font-size: 0.85rem; font-weight: bold; 
            justify-content: space-between; align-items: center; z-index: 2000; flex-wrap: wrap; gap: 6px;
        }

        /* Workspace Grid */
        .workspace { flex: 1; display: flex; position: relative; overflow: hidden; width: 100%; }
        #tacticalMap { flex: 1; height: 100%; width: 100%; background: #000; }

        /* Compass HUD */
        .tactical-compass-hud {
            position: absolute; top: 14px; left: 14px; z-index: 1000;
            background: rgba(15, 23, 42, 0.85); border: 1px solid var(--border);
            border-radius: 8px; padding: 6px; display: flex; flex-direction: column;
            align-items: center; gap: 5px; backdrop-filter: blur(6px);
            box-shadow: 0 4px 14px rgba(0,0,0,0.6); user-select: none;
        }
        .compass-dial-btn {
            width: 44px; height: 44px; border-radius: 50%; background: #1e293b;
            border: 2px solid #334155; cursor: pointer; display: flex;
            align-items: center; justify-content: center; position: relative;
        }
        .compass-needle-svg { width: 32px; height: 32px; transition: transform 0.2s ease-out; }
        .compass-bearing-label { font-size: 0.65rem; font-weight: 900; color: var(--accent-blue); letter-spacing: 1px; }
        .compass-actions { display: flex; gap: 3px; }
        .btn-rot {
            background: #1e293b; color: #fff; border: 1px solid var(--border);
            border-radius: 4px; font-size: 0.7rem; font-weight: bold;
            padding: 3px 6px; cursor: pointer; transition: 0.15s;
        }
        .btn-rot:hover { background: var(--accent-blue); color: #000; }

        /* Sidebar Roster */
        .sidebar { 
            width: 340px; background: var(--panel-bg); border-left: 2px solid var(--border); 
            display: flex; flex-direction: column; transition: all 0.2s ease-in-out; z-index: 1050;
        }
        .sidebar-header { 
            padding: 12px 16px; border-bottom: 1px solid var(--border); 
            font-size: 0.85rem; font-weight: bold; color: var(--accent-blue); 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .unit-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }

        /* Commando Cards */
        .unit-card { 
            background: #0f172a; border: 1px solid var(--border); border-radius: 6px; 
            padding: 10px; cursor: pointer; transition: border-color 0.2s, background 0.2s, transform 0.15s;
        }
        .unit-card:hover { transform: translateX(-2px); }
        
        .unit-card.card-online { border: 1px solid var(--color-online); border-left: 4px solid var(--color-online); background: #0f172a; }
        .unit-card.card-relay { border: 1px solid var(--color-relay); border-left: 4px solid var(--color-relay); background: rgba(245, 158, 11, 0.12); }
        .unit-card.card-casualty { border: 2px solid var(--color-distress); background: rgba(127, 29, 29, 0.35); }
        .unit-card.card-stale { border: 1px solid var(--color-gps-lost); background: rgba(30, 27, 75, 0.25); opacity: 0.85; }
        .unit-card.card-offline { border: 1px solid var(--color-offline); background: rgba(15, 23, 42, 0.35); opacity: 0.45; color: #64748b; }
        .unit-card.card-squad { border-left: 5px solid #38bdf8 !important; box-shadow: 0 0 10px rgba(56, 189, 248, 0.15); background: #0b1329 !important; }

        .btn-listen { width: 100%; margin-top: 8px; padding: 8px; font-size: 0.75rem; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; background: #dc2626; color: #fff; }
        .btn-listen.monitoring { background: var(--color-online); color: #fff; }

        .btn-tool {
            background: #1e293b; color: #fff; border: 1px solid var(--border); 
            padding: 6px 10px; font-size: 0.72rem; border-radius: 4px; cursor: pointer; 
            white-space: nowrap; flex-shrink: 0;
        }
        .btn-tool.active { background: var(--accent-blue); color: #000; font-weight: bold; }
        .btn-tool.btn-threat { border-color: #dc2626; color: #fca5a5; }
        .btn-tool.btn-threat.active { background: #dc2626; color: #fff; font-weight: bold; }
        .btn-tool.btn-ied { border-color: #d97706; color: #fde68a; }
        .btn-tool.btn-ied.active { background: #d97706; color: #000; font-weight: bold; }
        .btn-breach { border-color: #16a34a; color: #86efac; }
        .btn-breach.active { background: #16a34a; color: #fff; font-weight: bold; }
        .btn-merge { border-color: #38bdf8; color: #7dd3fc; font-weight: bold; }
        .btn-merge.active { background: #0284c7; color: #fff; }
        .btn-purge { border-color: #f59e0b; color: #fef08a; font-weight: bold; }
        .btn-logout { background: #dc2626; border-color: #ef4444; font-weight: bold; }

        /* Tactical Markers */
        .commando-marker {
            width: 28px; height: 28px; border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; font-size: 11px; 
            font-weight: 900; color: #fff; border: 2px solid #fff; box-shadow: 0 0 10px rgba(0,0,0,0.8);
            transition: transform 0.2s ease-out;
        }

        /* Modals */
        #hitMergeModal, #commsModal {
            display: none; position: fixed; inset: 0; background: rgba(8, 12, 20, 0.85); 
            z-index: 9998; align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }
        .merge-dialog {
            background: #111827; border: 2px solid #38bdf8; border-radius: 12px; 
            width: 480px; max-width: 94vw; padding: 22px; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9);
        }
        .merge-dialog h3 {
            font-size: 1.05rem; color: #38bdf8; letter-spacing: 1.5px; 
            margin-bottom: 14px; text-transform: uppercase; display: flex; 
            justify-content: space-between; align-items: center;
        }
        .merge-dialog label {
            display: block; font-size: 0.72rem; color: var(--text-muted); 
            margin-top: 10px; margin-bottom: 4px; text-transform: uppercase; font-weight: bold;
        }
        .merge-dialog select {
            width: 100%; background: #0f172a; color: #fff; border: 1px solid #334155; 
            padding: 9px; border-radius: 6px; font-size: 0.88rem; outline: none; margin-bottom: 8px;
        }

        .dark-tiles { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }

        @media (max-width: 768px) {
            header { padding: 6px 10px; }
            .op-title { font-size: 0.85rem; letter-spacing: 1.5px; }
            .sidebar { position: absolute; top: 0; right: 0; bottom: 0; width: 86vw; max-width: 350px; }
        }
    </style>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>

    <audio id="remoteAudioPlayer" autoplay playsinline></audio>

    <!-- Firebase Authentication Login Overlay (Previous Login restored) -->
    <div id="authOverlay">
        <div class="auth-card">
            <svg class="auth-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 4L12 18V50C12 73.5 50 96 50 96C50 96 88 73.5 88 50V18L50 4Z" fill="#0f172a" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
                <path d="M50 18V64" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
                <path d="M43 27L50 18L57 27" fill="#ffffff"/>
                <path d="M38 48H62" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
            </svg>
            <div class="auth-welcome-title">WELCOME</div>
            <div class="auth-subtitle">COMMANDO TRACKING SYSTEM</div>
            <input type="email" id="c2Email" value="anilmetkar0206@gmail.com" placeholder="Operator Email" style="display:none;">
            <input type="password" id="c2Password" placeholder="Enter Firebase Password" onkeydown="if(event.key==='Enter') loginWithFirebaseAuth()">
            <button id="loginBtn" onclick="loginWithFirebaseAuth()">LOGIN</button>
        </div>
    </div>

    <!-- Emergency Casualty Alert Banner -->
    <div id="casualtyNoticeBar">
        <span id="casualtyNoticeText">🚨 SIGNAL ALERT: CASUALTY / DISTRESS RECORDED ON GRID</span>
        <button onclick="focusLatestCasualty()" style="background:#fff; color:#000; border:none; padding:4px 10px; font-weight:bold; cursor:pointer; border-radius:4px;">FOCUS TARGET</button>
    </div>

    <!-- Header Operations Bar -->
    <header>
        <div class="header-brand">
            <div class="op-title">FORCE ONE TACTICAL C2</div>
            <div class="stat-badges">
                <div class="badge" style="color:var(--color-online);">ONLINE: <span id="onlineCount">0</span></div>
                <div class="badge" style="color:var(--color-relay);">RELAYED: <span id="relayCount">0</span></div>
                <div class="badge" style="color:var(--color-distress);">CASUALTIES: <span id="casualtyCount">0</span></div>
                <div class="badge" style="color:#ca8a04;">GPS LOST: <span id="staleCount">0</span></div>
            </div>
        </div>
        <div class="toolbar-actions">
            <button id="toggleRosterBtn" class="btn-tool active" onclick="toggleSidebar()">👁️ HIDE ROSTER</button>
            <button id="btnComms" class="btn-tool" onclick="openCommsModal()" style="background:#0369a1; color:#fff; border-color:#38bdf8;">✉️ SEND MESSAGE</button>
            <button id="toggleOfflineBtn" class="btn-tool" onclick="toggleOfflineFilter()">🟢 ONLINE ONLY: OFF</button>
            <button id="purgeBtn" class="btn-tool btn-purge" onclick="purgeDatabaseGhosts()">🧹 PURGE GHOSTS</button>
            <button id="sirenMuteBtn" class="btn-tool" onclick="toggleSirenMute()">🔔 SIREN: ON</button>
            <button class="btn-tool btn-logout" onclick="logoutC2()">🔒 LOGOUT</button>
        </div>
    </header>

    <!-- Message Dispatch Modal with Targeted Recipient & 1-Hour TTL -->
    <div id="commsModal">
        <div class="merge-dialog" style="width:480px; max-width:94vw; border-color:#38bdf8; box-shadow:0 0 25px rgba(56,189,248,0.25);">
            <h3>
                <span>✉️ SEND MESSAGE TO FIELD (1-HR TTL)</span>
                <span onclick="closeCommsModal()" style="cursor:pointer; color:#94a3b8; font-size:1.1rem;">✕</span>
            </h3>

            <label for="commsScopeSelect">1. TARGET RECIPIENT</label>
            <select id="commsScopeSelect" onchange="onCommsScopeChange()">
                <option value="ALL">📢 BROADCAST TO ALL UNITS</option>
                <option value="GROUP">👥 SPECIFIC GROUP (Alfa, Bravo, etc.)</option>
                <option value="HIT">🎯 SPECIFIC HIT (Hit Squad)</option>
                <option value="COMMANDO">👤 INDIVIDUAL COMMANDO</option>
            </select>

            <div id="commsGroupRow" style="display:none;">
                <label for="commsGroupSelect">SELECT GROUP</label>
                <select id="commsGroupSelect" onchange="onCommsGroupChange()">
                    <option value="Alfa">Alfa</option><option value="Bravo">Bravo</option><option value="Charlie" selected>Charlie</option><option value="Delta">Delta</option><option value="SOT">SOT</option><option value="Sniper">Sniper</option><option value="BD">BD</option>
                </select>
            </div>

            <div id="commsHitRow" style="display:none;">
                <label for="commsHitSelect">SELECT HIT ASSIGNMENT</label>
                <select id="commsHitSelect" onchange="onCommsHitChange()"></select>
            </div>

            <div id="commsCommandoRow" style="display:none;">
                <label for="commsCommandoSelect">SELECT INDIVIDUAL COMMANDO</label>
                <select id="commsCommandoSelect"></select>
            </div>

            <label>2. QUICK MESSAGE PRESETS</label>
            <div style="display:flex; flex-wrap:wrap; gap:5px; margin-top:4px; margin-bottom:8px;">
                <button type="button" class="btn-tool" onclick="setPresetOrder('HOLD POSITION & MAINTAIN COVER')" style="color:#38bdf8; border-color:#334155;">🛑 HOLD POSITION</button>
                <button type="button" class="btn-tool btn-breach" onclick="setPresetOrder('COMMENCE BREACH ON SIGNAL')">🟢 COMMENCE BREACH</button>
                <button type="button" class="btn-tool btn-ied" onclick="setPresetOrder('FALL BACK TO PERIMETER')">⚠️ FALL BACK</button>
            </div>

            <label for="commsMessageInput">3. MESSAGE TEXT (Auto-wipes in 1 Hour)</label>
            <textarea id="commsMessageInput" rows="3" placeholder="Type custom operational message..." style="width:100%; background:#0f172a; color:#fff; border:1px solid #334155; border-radius:6px; padding:10px; font-size:0.85rem; font-family:monospace; margin-bottom:10px; outline:none; resize:none;"></textarea>

            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
                <span id="commsDispatchStatus" style="font-size:0.75rem; color:#4ade80; font-weight:bold;"></span>
                <div style="display:flex; gap:8px;">
                    <button type="button" onclick="closeCommsModal()" style="background:#334155; color:#fff; border:none; padding:9px 14px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:0.8rem;">CANCEL</button>
                    <button type="button" onclick="dispatchTacticalOrder()" style="background:#0284c7; color:#fff; border:1px solid #38bdf8; font-weight:bold; padding:9px 16px; border-radius:6px; cursor:pointer; font-size:0.8rem; letter-spacing:1px;">SEND DIRECTIVE 📤</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Workspace -->
    <div class="workspace">
        <div id="tacticalMap">
            <!-- Compass HUD -->
            <div class="tactical-compass-hud">
                <div class="compass-dial-btn" onclick="resetNorth()">
                    <svg id="northNeedle" class="compass-needle-svg" viewBox="0 0 100 100" fill="none">
                        <polygon points="50,6 61,48 50,40 39,48" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
                        <polygon points="50,94 61,52 50,60 39,52" fill="#64748b" stroke="#ffffff" stroke-width="1.5" />
                        <circle cx="50" cy="50" r="4.5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
                        <text x="50" y="22" fill="#ffffff" font-size="10" font-weight="900" text-anchor="middle">N</text>
                    </svg>
                </div>
                <div id="bearingDisplay" class="compass-bearing-label">0° N</div>
                <div class="compass-actions">
                    <button class="btn-rot" onclick="rotateMapRelative(-15)">⟲</button>
                    <button class="btn-rot" onclick="resetNorth()">N</button>
                    <button class="btn-rot" onclick="rotateMapRelative(15)">⟳</button>
                </div>
            </div>
        </div>

        <div id="sidebarPanel" class="sidebar">
            <div class="sidebar-header">
                <span>OPERATIONAL ELEMENTS</span>
                <span id="totalUnitsBadge" style="font-size:0.75rem; color:var(--text-muted);">0 UNITS</span>
            </div>
            <div id="unitList" class="unit-list">
                <div id="emptyRosterMsg" style="color:var(--text-muted); font-size:0.8rem; text-align:center; margin-top:20px;">
                    Authenticating with Firebase...
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAXJsxJDkSxiYFHRKWKjPVkWSDcnAXb4_g",
            authDomain: "forceone-ops.firebaseapp.com",
            databaseURL: "https://forceone-ops-default-rtdb.firebaseio.com",
            projectId: "forceone-ops",
            storageBucket: "forceone-ops.firebasestorage.app",
            messagingSenderId: "1035569483131",
            appId: "1:1035569483131:web:ca675d22897f344f2ac1de"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const C2_OPERATOR_EMAIL = "anilmetkar0206@gmail.com";

        // Initialize Map with Rotation Support Enabled
        const map = L.map('tacticalMap', { 
            zoomControl: false, rotate: true, bearing: 0, touchRotate: true, shiftKeyRotate: true 
        }).setView([19.143896, 72.870933], 15);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Map Layers: Dark Tactical & Esri Satellite
        const tacticalDarkLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19, className: 'dark-tiles', attribution: 'Tactical Grid'
        }).addTo(map);

        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19, attribution: 'Esri Satellite'
        });

        L.control.layers({
            "Dark Tactical Map": tacticalDarkLayer,
            "Satellite Imagery": satelliteLayer
        }, null, { position: 'topright' }).addTo(map);

        const markers = {}, knownUnits = {};
        let telemetryRef = null, isListening = false, hideOffline = false, latestCasualtyLatLng = null;

        // WebRTC & Audio Settings
        const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
        let activePeerConnection = null, currentListeningUnit = null, candidatesListenerRef = null;
        let isSirenMuted = false, audioCtx = null, isSirenPlaying = false, activeSirenOsc = null, audioSourceNode = null;
        const activeCasualties = new Set();

        document.addEventListener('click', () => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        });

        function sanitizeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function getUnitGroupAndHit(unit, key) {
            let group = unit.group || "", hit = unit.hit || "";
            const callsign = (unit.callsign || key || "").toUpperCase();
            if (!group) {
                ["ALFA", "ALPHA", "BRAVO", "CHARLIE", "DELTA", "SOT", "SNIPER", "BD"].forEach(g => {
                    if (callsign.includes(g)) group = (g === "ALPHA") ? "Alfa" : (g.charAt(0) + g.slice(1).toLowerCase());
                });
            }
            if (!hit) {
                const mHit = callsign.match(/HIT[- ]?(\d+)/i);
                if (mHit) hit = `Hit ${mHit[1]}`;
            }
            return { group: group || "Unknown", hit: hit || "Unknown", canonicalKey: `${(group||"UNKNOWN").toUpperCase()}::${(hit||"UNKNOWN").toUpperCase().replace(/\s+/g,"")}` };
        }

        // --- MAP ROTATION & NORTH COMPASS ---
        function updateNorthCompass(deg) {
            const normalized = ((Math.round(deg) % 360) + 360) % 360;
            const needle = document.getElementById("northNeedle"), label = document.getElementById("bearingDisplay");
            if (needle) needle.style.transform = `rotate(${-normalized}deg)`;
            if (label) label.innerText = `${normalized}° N`;
        }
        map.on('rotate', () => { if (typeof map.getBearing === 'function') updateNorthCompass(map.getBearing()); });
        function rotateMapRelative(delta) { if (typeof map.setBearing === 'function') { const cur = map.getBearing() || 0; map.setBearing(cur + delta); updateNorthCompass(cur + delta); } }
        function resetNorth() { if (typeof map.setBearing === 'function') { map.setBearing(0); updateNorthCompass(0); } }

        // --- FIREBASE AUTHENTICATION (PREVIOUS LOGIN) ---
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                document.getElementById("authOverlay").style.display = "none";
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                startListeningTelemetry();
            } else {
                document.getElementById("authOverlay").style.display = "flex";
                if (telemetryRef) { telemetryRef.off(); telemetryRef = null; }
                isListening = false;
            }
        });

        async function loginWithFirebaseAuth() {
            const password = document.getElementById("c2Password").value;
            const loginBtn = document.getElementById("loginBtn");
            if (!password) { alert("Please enter your Firebase password."); return; }

            loginBtn.innerText = "AUTHENTICATING...";
            loginBtn.disabled = true;

            try {
                await firebase.auth().signInWithEmailAndPassword(C2_OPERATOR_EMAIL, password);
                document.getElementById("c2Password").value = "";
            } catch (err) {
                alert("Auth Failed: " + err.message);
                document.getElementById("c2Password").value = "";
            } finally {
                loginBtn.innerText = "LOGIN";
                loginBtn.disabled = false;
            }
        }

        function logoutC2() {
            if (telemetryRef) { telemetryRef.off(); telemetryRef = null; }
            isListening = false;
            stopAudioMonitoring();
            firebase.auth().signOut().then(() => location.reload());
        }

        // --- TARGETED COMMS MODAL & DROPDOWNS ---
        function openCommsModal() {
            document.getElementById("commsModal").style.display = "flex";
            onCommsScopeChange();
        }
        function closeCommsModal() {
            document.getElementById("commsModal").style.display = "none";
            document.getElementById("commsDispatchStatus").innerText = "";
        }

        function onCommsScopeChange() {
            const scope = document.getElementById("commsScopeSelect").value;
            document.getElementById("commsGroupRow").style.display = (scope === "ALL") ? "none" : "block";
            document.getElementById("commsHitRow").style.display = (scope === "HIT" || scope === "COMMANDO") ? "block" : "none";
            document.getElementById("commsCommandoRow").style.display = (scope === "COMMANDO") ? "block" : "none";
            if (scope !== "ALL") onCommsGroupChange();
        }

        function onCommsGroupChange() {
            const group = document.getElementById("commsGroupSelect").value, hitSelect = document.getElementById("commsHitSelect");
            hitSelect.innerHTML = "";
            if (["Alfa", "Bravo", "Charlie", "Delta"].includes(group)) for (let i = 1; i <= 8; i++) hitSelect.add(new Option(`Hit ${i}`, `Hit ${i}`));
            else if (group === "SOT") for (let i = 1; i <= 2; i++) hitSelect.add(new Option(`Hit ${i}`, `Hit ${i}`));
            else if (group === "Sniper") ["India 1", "India 2", "India 3", "India 4"].forEach(s => hitSelect.add(new Option(s, s)));
            else if (group === "BD") ["BD 1", "BD 2"].forEach(b => hitSelect.add(new Option(b, b)));
            onCommsHitChange();
        }

        function onCommsHitChange() {
            if (document.getElementById("commsScopeSelect").value === "COMMANDO") {
                populateCommandoDropdown();
            }
        }

        function populateCommandoDropdown() {
            const commandoSelect = document.getElementById("commsCommandoSelect");
            commandoSelect.innerHTML = "";
            const group = document.getElementById("commsGroupSelect").value;
            const hit = document.getElementById("commsHitSelect").value;
            const cleanG = group.toUpperCase(), cleanH = hit.toUpperCase().replace(/\s+/g,"");
            
            const seen = new Set();
            Object.keys(knownUnits).forEach(k => {
                const u = knownUnits[k], info = getUnitGroupAndHit(u, k);
                if (info.canonicalKey === `${cleanG}::${cleanH}`) {
                    const callsign = (u.callsign || k).toUpperCase();
                    if (!seen.has(callsign)) {
                        seen.add(callsign);
                        commandoSelect.add(new Option(`● ACTIVE: ${callsign}`, callsign));
                    }
                }
            });

            for (let i = 1; i <= 6; i++) {
                const std = `${cleanG}-${cleanH}-CDO-${i}`.toUpperCase();
                if (!seen.has(std)) {
                    seen.add(std);
                    commandoSelect.add(new Option(`${group} - ${hit} - Position ${i}`, std));
                }
            }
        }

        function setPresetOrder(text) { document.getElementById("commsMessageInput").value = text; }

        // --- 1-HOUR TTL MESSAGE DISPATCH & AUTO-WIPE ---
        function dispatchTacticalOrder() {
            const text = document.getElementById("commsMessageInput").value.trim();
            if (!text) { alert("Please enter message text."); return; }

            const scope = document.getElementById("commsScopeSelect").value;
            const group = document.getElementById("commsGroupSelect").value;
            const hit = document.getElementById("commsHitSelect").value;
            const targetCallsign = document.getElementById("commsCommandoSelect").value;

            const oneHourInMillis = 60 * 60 * 1000; // Exactly 1 hour

            const payload = {
                orderId: "MSG_" + Date.now(),
                scope: scope,
                group: (scope !== "ALL") ? group : "ALL",
                hit: (scope === "HIT" || scope === "COMMANDO") ? hit : "ALL",
                targetCallsign: (scope === "COMMANDO") ? targetCallsign : "ALL",
                message: text,
                sender: "HQ COMMAND",
                timestamp: Date.now(),
                expiresAt: Date.now() + oneHourInMillis // 1-Hour TTL
            };

            const statusEl = document.getElementById("commsDispatchStatus");
            statusEl.innerText = "TRANSMITTING (1-HR TTL)...";
            statusEl.style.color = "#38bdf8";

            database.ref("active_order").set(payload, (err) => {
                if (err) {
                    statusEl.innerText = "SEND FAILED";
                    statusEl.style.color = "#ef4444";
                } else {
                    statusEl.innerText = "✓ SENT (Auto-wipes in 1h)";
                    statusEl.style.color = "#4ade80";
                    setTimeout(() => { closeCommsModal(); document.getElementById("commsMessageInput").value = ""; }, 1200);
                }
            });

            setTimeout(() => {
                database.ref("active_order").once("value", (snap) => {
                    const currentOrder = snap.val();
                    if (currentOrder && currentOrder.orderId === payload.orderId) {
                        database.ref("active_order").remove();
                    }
                });
            }, oneHourInMillis);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById("sidebarPanel"), btn = document.getElementById("toggleRosterBtn");
            const isHidden = sidebar.style.display === "none";
            sidebar.style.display = isHidden ? "flex" : "none";
            btn.innerText = isHidden ? "👁️ HIDE ROSTER" : "👁️ SHOW ROSTER";
            setTimeout(() => map.invalidateSize(), 150);
        }

        function toggleOfflineFilter() {
            hideOffline = !hideOffline;
            document.getElementById("toggleOfflineBtn").innerText = hideOffline ? "🟢 ONLINE ONLY: ON" : "🟢 ONLINE ONLY: OFF";
            renderTelemetry();
        }

        // --- DISTRESS SIREN ---
        function playDistressSiren() {
            if (isSirenMuted || isSirenPlaying) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') return;

                isSirenPlaying = true;
                const t = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                activeSirenOsc = osc;
                osc.type = "sawtooth";

                for (let i = 0; i < 5; i++) {
                    const step = i * 0.6;
                    osc.frequency.setValueAtTime(850, t + step);
                    osc.frequency.exponentialRampToValueAtTime(420, t + step + 0.3);
                    osc.frequency.exponentialRampToValueAtTime(850, t + step + 0.6);
                }

                gain.gain.setValueAtTime(0.25, t);
                gain.gain.linearRampToValueAtTime(0.001, t + 3.0);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + 3.0);

                setTimeout(() => { isSirenPlaying = false; activeSirenOsc = null; }, 3000);
            } catch (e) {
                isSirenPlaying = false;
                activeSirenOsc = null;
            }
        }

        function toggleSirenMute() {
            isSirenMuted = !isSirenMuted;
            const btn = document.getElementById("sirenMuteBtn");
            if (isSirenMuted) {
                btn.innerText = "🔕 SIREN: OFF";
                if (activeSirenOsc) { try { activeSirenOsc.stop(); } catch(e){} activeSirenOsc = null; }
                isSirenPlaying = false;
            } else {
                btn.innerText = "🔔 SIREN: ON";
            }
        }

        // --- WEBRTC AUDIO INTERCEPT (SPEAKER ON) ---
        async function toggleAudioListen(unitKey) {
            const player = document.getElementById("remoteAudioPlayer");
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();

            if (currentListeningUnit === unitKey) {
                stopAudioMonitoring();
                return;
            }

            stopAudioMonitoring();
            currentListeningUnit = unitKey;
            const btn = document.getElementById(`audioBtn_${unitKey}`);
            if (btn) { btn.classList.add("monitoring"); btn.innerText = "⏳ CONNECTING..."; }

            try {
                await database.ref(`webrtc/${unitKey}/m_candidates`).remove();
                await database.ref(`webrtc/${unitKey}/answer`).remove();

                const pc = new RTCPeerConnection(rtcConfig);
                activePeerConnection = pc;
                pc.addTransceiver('audio', { direction: 'recvonly' });

                pc.ontrack = (event) => {
                    const stream = event.streams && event.streams[0] ? event.streams[0] : new MediaStream([event.track]);
                    player.srcObject = stream;
                    player.muted = false;
                    player.volume = 1.0;
                    player.play().catch(e => console.warn(e));

                    try {
                        if (audioSourceNode) audioSourceNode.disconnect();
                        audioSourceNode = audioCtx.createMediaStreamSource(stream);
                        audioSourceNode.connect(audioCtx.destination);
                    } catch (err) {}

                    if (btn) { btn.classList.add("monitoring"); btn.innerText = "🔊 SPEAKER: ON (MUTE)"; }
                };

                pc.onicecandidate = (event) => {
                    if (event.candidate && pc.signalingState !== "closed") {
                        database.ref(`webrtc/${unitKey}/m_candidates`).push(event.candidate.toJSON());
                    }
                };

                const offerSnap = await database.ref(`webrtc/${unitKey}/offer`).get();
                const offer = offerSnap.val();
                if (!offer) { alert("Audio stream not ready."); stopAudioMonitoring(); return; }

                await pc.setRemoteDescription(new RTCSessionDescription(offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                await database.ref(`webrtc/${unitKey}/answer`).set({ sdp: answer.sdp, type: answer.type });

                candidatesListenerRef = database.ref(`webrtc/${unitKey}/c_candidates`);
                candidatesListenerRef.on("child_added", async (snap) => {
                    const candidate = snap.val();
                    if (candidate && pc && pc.signalingState !== "closed" && pc.remoteDescription) {
                        try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch (err) {}
                    }
                });
            } catch (err) {
                alert("Audio link failed: " + err.message);
                stopAudioMonitoring();
            }
        }

        function stopAudioMonitoring() {
            if (candidatesListenerRef) { candidatesListenerRef.off(); candidatesListenerRef = null; }
            if (audioSourceNode) { try { audioSourceNode.disconnect(); } catch(e){} audioSourceNode = null; }
            if (activePeerConnection) { activePeerConnection.close(); activePeerConnection = null; }
            const player = document.getElementById("remoteAudioPlayer");
            if (player) { player.srcObject = null; player.pause(); }

            if (currentListeningUnit) {
                const btn = document.getElementById(`audioBtn_${currentListeningUnit}`);
                if (btn) { btn.classList.remove("monitoring"); btn.innerText = "🎙️ TURN SPEAKER ON (LISTEN)"; }
                currentListeningUnit = null;
            }
        }

        function startListeningTelemetry() {
            if (isListening) return;
            isListening = true;
            telemetryRef = database.ref("commandos");
            telemetryRef.on("value", (snapshot) => {
                const incomingData = snapshot.val() || {};
                Object.keys(incomingData).forEach(k => { knownUnits[k] = incomingData[k]; });
                renderTelemetry();
            });
        }

        function renderTelemetry() {
            if (!isListening) return;
            const data = knownUnits, unitListEl = document.getElementById("unitList");
            let onlineCount = 0, casualtyCount = 0, visibleEntitiesCount = 0;

            unitListEl.innerHTML = "";

            Object.keys(data).forEach((key) => {
                const unit = data[key];
                if (!unit) return;
                visibleEntitiesCount++;
                const isCasualty = !!unit.casualty;
                if (isCasualty) {
                    casualtyCount++;
                    latestCasualtyLatLng = [unit.lat, unit.lng];
                    if (!activeCasualties.has(key)) {
                        activeCasualties.add(key);
                        if (!isSirenMuted) playDistressSiren();
                    }
                } else {
                    activeCasualties.delete(key);
                }

                if (unit.lat && unit.lng) {
                    onlineCount++;
                    const latLng = [unit.lat, unit.lng];
                    const markerHtml = `<div class="commando-marker" style="background:${isCasualty ? '#dc2626' : '#15803d'};">${sanitizeHtml(unit.callsign || key).substring(0,2).toUpperCase()}</div>`;
                    
                    if (!markers[key]) {
                        markers[key] = L.marker(latLng, { icon: L.divIcon({ html: markerHtml, className: '', iconSize: [28, 28] }) }).addTo(map);
                        markers[key].bindPopup(`<strong>${sanitizeHtml(unit.callsign || key)}</strong>`);
                    } else {
                        markers[key].setLatLng(latLng);
                    }
                }

                const card = document.createElement("div");
                card.className = `unit-card ${isCasualty ? 'card-casualty' : 'card-online'}`;
                card.onclick = () => { if (unit.lat && unit.lng) map.flyTo([unit.lat, unit.lng], 18); };
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong style="color:#fff;">${sanitizeHtml(unit.callsign || key)}</strong>
                        <span style="font-size:0.75rem; font-weight:bold; color:${isCasualty ? 'var(--color-distress)' : 'var(--color-online)'}">${isCasualty ? '🚨 CASUALTY' : '● ONLINE'}</span>
                    </div>
                    ${unit.audioActive ? `
                        <button id="audioBtn_${key}" class="btn-listen ${currentListeningUnit === key ? 'monitoring' : ''}" 
                                onclick="event.stopPropagation(); toggleAudioListen('${key}')">
                            ${currentListeningUnit === key ? '🔊 SPEAKER: ON (MUTE)' : '🎙️ TURN SPEAKER ON (LISTEN)'}
                        </button>
                    ` : ''}
                `;
                unitListEl.appendChild(card);
            });

            document.getElementById("onlineCount").innerText = onlineCount;
            document.getElementById("casualtyCount").innerText = casualtyCount;
            document.getElementById("totalUnitsBadge").innerText = `${visibleEntitiesCount} ELEMENTS`;
            document.getElementById("casualtyNoticeBar").style.display = casualtyCount > 0 ? "flex" : "none";
        }

        function purgeDatabaseGhosts() {
            database.ref("commandos").get().then(snap => {
                const all = snap.val() || {};
                Object.keys(all).forEach(k => {
                    if (Date.now() - (all[k].lastUpdated || 0) > 45000) database.ref("commandos/" + k).remove();
                });
                alert("Database ghost purge complete.");
            });
        }

        function focusLatestCasualty() { if (latestCasualtyLatLng) map.flyTo(latestCasualtyLatLng, 18); }
    </script>
